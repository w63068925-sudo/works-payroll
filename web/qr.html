<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>簽到/簽退 QR 碼｜沃克思</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--paper:#f5f2ec;--card:#fffdf9;--ink:#1d1c1a;--muted:#6f6b63;--line:#e3ded3;--accent:#1f5c4a;--warn:#8a5a00;--warn-soft:#fbf1d9;--danger:#a3271f;--danger-soft:#fbe6e3}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
.brand{font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:600}
h1{font-size:22px;margin:6px 0 4px;line-height:1.35;max-width:560px}
.sub{color:var(--muted);font-size:14px;margin:0}
.qr{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:20px auto 12px;width:min(82vw,62vh,440px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.qr svg{width:100%;height:100%;display:block}
.bar{height:4px;background:var(--line);border-radius:2px;width:min(82vw,62vh,440px);overflow:hidden;margin:0 auto}
.bar i{display:block;height:100%;background:var(--accent);width:100%;transition:width 1s linear}
.msg{border-radius:12px;padding:14px 16px;font-size:15px;max-width:440px;margin:18px auto 0;text-align:left;line-height:1.6}
.msg.err{background:var(--danger-soft);color:var(--danger)}.msg.warn{background:var(--warn-soft);color:var(--warn)}
.foot{color:var(--muted);font-size:12.5px;margin-top:16px;max-width:440px;line-height:1.6}
/* 2026-11-28 風格 A「溫暖好客」 */
:root{--paper:#ffffff;--card:#ffffff;--ink:#222222;--muted:#6a6a6a;--line:#ebebeb;--danger:#c13515;--danger-soft:#fff0ed}
body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.selfbtn{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 22px;margin:16px auto 0;border-radius:999px;background:#ff385c;color:#fff;font-weight:600;text-decoration:none;font-size:15px}
.selfbtn{border:0;cursor:pointer;font:inherit}.selfbtn:disabled{opacity:.5}
.msg.ok{background:#e7f5ee;color:#1d7a55}.msg a{color:inherit;font-weight:600}
</style>
</head>
<body>
<div class="brand">WORKS 沃克思</div>
<div id="app"><p class="sub" style="margin-top:20px">載入中…</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous"></script>
<script>
(() => {
const API = 'https://rxekuiadnzjfvjcgmrxr.supabase.co/rest/v1/rpc/';
const KEY = 'sb_publishable_ZQtUdhkpsPV_XhIkI1K05A_mDaLNsQQ';
const app = document.getElementById('app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = s => s ? s.slice(5).replace('-', '/') : '';
const tpe = t => new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(t));
// 分享碼放在網址 # 後面：不會送到網站伺服器，也不會出現在連線紀錄
const share = (location.hash.match(/[#&]s=([0-9a-f]{48})/) || [])[1];
let timer = null, lock = null, built = false, fails = 0;

function fatal(text) { clearTimeout(timer); app.innerHTML = '<div class="msg err">' + esc(text) + '</div>'; }

// 拿著 QR 畫面的人自己簽到／簽退：在這個畫面直接完成並顯示結果，QR 碼留在上方繼續給大家掃
// 用這支手機上的工讀生登入（工讀生頁登入時存的憑證）；沒登入才開新分頁去登入

// QR 畫面下方的今日打卡名單：誰還沒簽到、誰上班中、誰已簽退（每 15 秒更新）
function rosterHtml(rows) {
  const e3 = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const n = k => rows.filter(r => r.state === k).length;
  const chip = { none: ['未簽到', '#fff4e5', '#8a5a00'], in: ['上班中', '#e7f5ee', '#1d7a55'], done: ['已簽退', '#f2f2f2', '#222'] };
  if (!rows.length) return '<p style="color:#6a6a6a;font-size:13px;margin:16px 0 0">今天這場活動沒有排班或打卡紀錄。</p>';
  return '<div style="margin-top:18px;text-align:left;max-width:520px;margin-left:auto;margin-right:auto">'
    + '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#6a6a6a;margin-bottom:8px"><b style="color:#222">今日打卡</b><span>未簽到 ' + n('none') + '</span><span>上班中 ' + n('in') + '</span><span>已簽退 ' + n('done') + '</span><span>共 ' + rows.length + ' 人</span></div>'
    + '<div style="border:1px solid #ebebeb;border-radius:14px;overflow:hidden;background:#fff">'
    + rows.map((r, i) => '<div style="display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:14px;' + (i ? 'border-top:1px solid #ebebeb' : '') + '">'
      + '<span style="flex:1;min-width:0;font-weight:600">' + e3(r.name) + (r.sched ? '<span style="font-weight:400;color:#6a6a6a;font-size:12px">　' + e3(r.sched) + '</span>' : '') + '</span>'
      + '<span style="font-size:12px;color:#6a6a6a;white-space:nowrap">' + (r.in ? '簽到 ' + e3(r.in) : '') + (r.out ? '　簽退 ' + e3(r.out) : '') + '</span>'
      + '<span style="font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:' + chip[r.state][1] + ';color:' + chip[r.state][2] + '">' + chip[r.state][0] + '</span></div>').join('')
    + '</div></div>';
}
function selfClockWidget(box, getUrl, getCode, getAt) {
  const wTok = () => { try { return sessionStorage.getItem('payroll_token') || localStorage.getItem('payroll_token_keep'); } catch (e) { return null; } };
  const wrpc = async (name, body) => { const res = await fetch(API + name, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); if (!res.ok) throw new Error('連線失敗'); return res.json(); };
  const e2 = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  box.innerHTML = '<button type="button" class="selfbtn" id="selfgo">我自己簽到／簽退</button><div id="selfmsg"></div>';
  const msg = (type, html) => { box.querySelector('#selfmsg').innerHTML = '<div class="msg ' + type + '" style="margin-top:12px;text-align:left">' + html + '</div>'; };
  const go = box.querySelector('#selfgo');
  let ticket = null, ticketCode = null, busy = false;
  const who0 = n => n ? e2(n) + '：' : '';
  const outBtn = '　<button type="button" id="selfout" style="background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit">不是你？登出這支手機</button>';
  const run = async (action, ack) => {
    if (busy) return;
    const tok = wTok();
    if (!tok) { msg('warn', '這支手機還沒用工讀生帳號登入。<a href="' + e2(getUrl()) + '" target="_blank" rel="noopener">登入並簽到</a>（會開新分頁，登入時勾「保持登入」，之後就能在這裡直接簽）。'); return; }
    busy = true; go.disabled = true; box.querySelectorAll('#selfok,#selfno').forEach(b => { b.disabled = true; });
    try {
      const code = getCode();
      if (!code) { msg('warn', 'QR 碼還在產生，請稍等再按。'); return; }
      // QR 超過 2 分鐘沒更新（多半是網路斷了）：不用舊碼簽到
      if (Date.now() - (getAt() || 0) > 120000) { msg('warn', 'QR 碼一段時間沒有更新，請確認網路後再按。'); return; }
      if (!ticket || ticketCode !== code) {
        const t = await wrpc('payroll_checkin_ticket', { p_code: code });
        if (!t.ok) { msg('warn', 'QR 碼剛好更新，請再按一次。'); ticket = null; return; }
        ticket = t.ticket; ticketCode = code;
      }
      let st = await wrpc('payroll_clock', { p_token: tok, p_ticket: ticket, p_action: 'status' });
      if (st.error === 'session') { msg('warn', '這支手機的工讀生登入已過期。<a href="' + e2(getUrl()) + '" target="_blank" rel="noopener">重新登入並簽到</a>'); return; }
      if (st.error === 'ticket') { ticket = null; msg('warn', 'QR 碼剛好更新，請再按一次。'); return; }
      const who = who0(st.me);
      const state = st.state || 'none';
      if (state === 'done') { msg('ok', who + '今天已完成簽到（' + e2(st.clock_in) + '）與簽退（' + e2(st.clock_out) + '）。'); return; }
      if (state === 'none' && st.block) { msg('warn', who + (st.block === 'not_scheduled' ? '你今天沒有被排到這場活動的班，無法簽到。' : '今天不在這場活動的日期內，無法簽到。')); return; }
      const act = action || (state === 'in' ? 'out' : 'in');
      const r = await wrpc('payroll_clock', { p_token: tok, p_ticket: ticket, p_action: act, p_ack: !!ack });
      if (r.error === 'need_ack' && r.notice) {
        box.querySelector('#selfmsg').innerHTML = '<div class="msg warn" style="margin-top:12px;text-align:left">' + who + e2(r.notice.text) + '<div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="selfbtn" id="selfok" style="margin:0;height:40px">確定' + (act === 'out' ? '簽退' : '簽到') + '</button><button type="button" class="selfbtn" id="selfno" style="margin:0;height:40px;background:#fff;color:#222;border:1px solid #ddd">先不要</button></div></div>';
        box.querySelector('#selfok').onclick = () => run(act, true);
        box.querySelector('#selfno').onclick = () => { box.querySelector('#selfmsg').innerHTML = ''; };
        return;
      }
      if (r.ok) { msg('ok', who + (act === 'in' ? '已簽到，時間 ' + e2(r.clock_in) + '。' : '已簽退，時間 ' + e2(r.clock_out) + '。辛苦了。') + (st.me ? outBtn : '')); bindOut(tok); if (window.__rosterNow) window.__rosterNow(); return; }
      msg('warn', who + ({ not_scheduled: '你今天沒有被排到這場活動的班，無法簽到。', not_event_day: '今天不在這場活動的日期內。', already_in: '你已經簽到過了。', already_done: '今天已經完成簽到與簽退。', not_in: '還沒簽到，無法簽退。' }[r.error] || '沒有完成，請再試一次。'));
    } catch (err) { msg('warn', '網路連線失敗，請再按一次。'); }
    finally { busy = false; go.disabled = false; }
  };
  // 共用手機：簽完看到不是自己，可以把這支手機的工讀生登入清掉
  const bindOut = tok => { const b = box.querySelector('#selfout'); if (!b) return; b.onclick = async () => {
    try { await wrpc('payroll_logout', { p_token: tok }); } catch (e) {}
    try { sessionStorage.removeItem('payroll_token'); localStorage.removeItem('payroll_token_keep'); } catch (e) {}
    ticket = null; msg('ok', '已登出這支手機的工讀生帳號。'); }; };
  go.onclick = () => run();
}
let curUrl = '', curCode = '', curAt = 0;
async function rpc(name, body) {
  const res = await fetch(API + name, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('連線失敗（' + res.status + '）');
  return res.json();
}
// 螢幕不要自動變暗（支援的瀏覽器）
async function keepAwake() { try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { keepAwake(); clearTimeout(timer); tick(); } });

async function tick() {
  clearTimeout(timer);
  let r;
  try { r = await rpc('payroll_share_checkin_code', { p_share: share }); }
  catch (e) { fails++; if (!built) app.innerHTML = '<div class="msg warn">網路連線失敗，自動重試中…</div>'; else document.getElementById('net').hidden = false; timer = setTimeout(tick, Math.min(30, 5 * fails) * 1000); return; }
  fails = 0;
  if (!r.ok) return fatal(r.error === 'expired' ? '這個打卡連結已過期（活動已結束）。需要的話請向管理員索取新的連結。' : '這個打卡連結已停用或無效。請向管理員索取新的連結。');
  if (!built) {
    built = true; document.title = r.event + '｜簽到/簽退 QR 碼';
    app.innerHTML = `<h1>${esc(r.event)}</h1><p class="sub">${esc(fmt(r.start_date))}${r.end_date !== r.start_date ? '–' + esc(fmt(r.end_date)) : ''}　掃描簽到／簽退</p>
      <div class="qr" id="qr"></div><div class="bar"><i id="bar"></i></div>
      <div id="selfbox" style="max-width:440px;margin:0 auto"></div>
      <div id="roster"></div>
      <div class="msg warn" id="net" hidden>網路不穩，QR 碼可能已過期，自動重試中…</div>
      <p class="foot">請工讀生用手機相機掃描，登入後完成簽到或簽退。QR 碼每分鐘自動更換，截圖或轉傳都會失效。<br>這個頁面請只在活動現場開給工讀生掃，不要轉傳。連結到 ${esc(tpe(r.expires_at))} 失效。</p>`;
  }
  document.getElementById('net').hidden = true;
  const url = new URL('./', location.href).href + '?k=' + r.code;
  const q = qrcode(0, 'M'); q.addData(url); q.make();
  // 拿著這支手機的人自己也要簽到退：開新分頁走同一個簽到流程（這個 QR 頁繼續開著給大家掃）
  curUrl = url; curCode = r.code; curAt = Date.now();
  if (!document.getElementById('selfgo')) selfClockWidget(document.getElementById('selfbox'), () => curUrl, () => curCode, () => curAt);
  document.getElementById('qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
  const left = Number(r.refresh_in) || 60, bar = document.getElementById('bar');
  bar.style.transition = 'none'; bar.style.width = (left / 60 * 100) + '%'; void bar.offsetWidth;
  bar.style.transition = 'width ' + left + 's linear'; bar.style.width = '0%';
  timer = setTimeout(tick, (left + 1) * 1000);
}

if (!share) fatal('連結不完整，請向管理員重新索取打卡連結。');
else if (typeof qrcode !== 'function') fatal('QR 元件載入失敗，請重新整理。');
else {
  keepAwake(); tick();
  let rtimer = null;
  let rstop = false;
  // 連結失效（停用、過期）就停止更新
  const loadRoster = async () => { clearTimeout(rtimer); if (rstop) return; try { const rr = await rpc('payroll_share_roster', { p_share: share }); const box = document.getElementById('roster'); if (rr.ok && box) box.innerHTML = rosterHtml(rr.rows || []); else if (rr.ok === false && rr.error) { rstop = true; if (box) box.innerHTML = '<p class="dim">打卡連結已失效，名單停止更新。</p>'; return; } } catch (e) {} rtimer = setTimeout(loadRoster, 15000); };
  window.__rosterNow = loadRoster;
  setTimeout(loadRoster, 800);
}
})();
</script>
</body>
</html>
