<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>薪資查詢｜沃克思</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#f5f2ec; --card:#fffdf9; --ink:#1d1c1a; --muted:#6f6b63; --line:#e3ded3;
  --accent:#1f5c4a; --accent-soft:#e4efe9; --warn:#8a5a00; --warn-soft:#fbf1d9; --danger:#a3271f; --danger-soft:#fbe6e3;
  --radius:14px; --num:"SF Mono","Roboto Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:baseline;gap:10px;margin:8px 0 28px}
.brand b{font-size:15px;letter-spacing:.18em}
.brand span{font-size:13px;color:var(--muted)}
h1{font-size:26px;line-height:1.25;margin:0 0 6px;font-weight:700;letter-spacing:.01em}
h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.12em;margin:28px 0 10px}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:18px}
label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px}
.field{position:relative}
input[type=text],input[type=password]{width:100%;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:17px;letter-spacing:.04em;outline:none}
input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(29,28,26,.08)}
.toggle{position:absolute;right:6px;top:6px;height:40px;padding:0 12px;border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;border-radius:8px}
.btn{display:block;width:100%;height:52px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:22px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.small{height:40px;width:auto;padding:0 14px;font-size:14px;margin:0}
.link{background:none;border:0;padding:8px 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.msg{margin-top:14px;margin-bottom:12px;padding:11px 13px;border-radius:10px;font-size:14px}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:22px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 0;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.slip{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;cursor:pointer}
.slip:hover{border-color:#cfc8b9}
.slip .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.slip .name{font-weight:600;font-size:16px}
.slip .amt{font-family:var(--num);font-size:19px;font-weight:600;white-space:nowrap}
.slip .meta{font-size:13px;color:var(--muted);margin-top:4px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.hero{padding:22px 18px 20px;text-align:center}
.hero .label{font-size:13px;color:var(--muted);letter-spacing:.12em}
.hero .net{font-family:var(--num);font-size:44px;font-weight:700;line-height:1.15;margin-top:4px;letter-spacing:-.01em}
select{width:100%;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:17px}
input[type=date],input[type=tel],input[type=email]{width:100%;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:17px;outline:none}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);margin-top:18px;line-height:1.6}
.check input{width:20px;height:20px;margin-top:2px;flex:0 0 auto}
.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc .st{font-size:13px;color:var(--muted)}.doc .st.ok{color:var(--accent)}
.filebtn{display:inline-flex;align-items:center;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;white-space:nowrap;background:#fff}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.filebtn:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(29,28,26,.08)}
.sday{font-size:13px;color:var(--muted);margin:16px 0 6px;font-weight:600}
.sopt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;cursor:pointer}
.sopt input{width:20px;height:20px;flex:0 0 auto}
.sopt .t{font-weight:600}.sopt .d{font-size:13px;color:var(--muted)}
.sopt.off{opacity:.55;cursor:default}
.sopt:has(input:checked){border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--paper);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.no{background:var(--danger-soft);color:var(--danger)}
.contract{white-space:pre-wrap;font-size:14px;line-height:1.8;max-height:55vh;overflow:auto}
.clock{font-family:var(--num);font-size:56px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.btn.big{height:64px;font-size:19px}
.btn.out{background:var(--accent)}
.hero .net small{font-size:18px;font-weight:500;margin-right:4px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-weight:400}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);letter-spacing:.06em}
.r{text-align:right;font-family:var(--num);white-space:nowrap}
.dim{color:var(--muted);font-size:12.5px}
.total td{font-weight:700;border-top:1px solid var(--ink);border-bottom:0}
.neg{color:var(--danger)}
/* 薪資單：逐日明細 */
.day{padding:16px 18px;margin-bottom:12px}
.day .dh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.day .dd{font-family:var(--num);font-size:19px;font-weight:700;color:var(--accent)}
.day .wd{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.day .rate{margin-left:auto;font-size:13px;color:var(--muted)}
.day .rate b{font-family:var(--num);color:var(--ink);font-weight:600}
.day .tm{font-size:14px;margin-top:6px}
.day .tm .sep{color:var(--line);margin:0 8px}
.day .lines{margin-top:10px;border-top:1px dashed var(--line);padding-top:4px}
.day .ln{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;color:#3d3a35}
.day .ln .x{color:var(--muted);font-size:12.5px;margin-left:4px}
.day .ln .a{font-family:var(--num)}
.day .df{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.day .df .a{font-family:var(--num)}
.day .df .pay{font-size:15px;color:var(--ink);font-weight:700}
.day .df .pay .a{color:var(--accent);font-size:17px}
.sum{background:var(--accent-soft);border-color:transparent;padding:16px 18px}
.sum .row2{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;color:#3d3a35}
.sum .row2 .a{font-family:var(--num)}
.sum .grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;padding-top:10px;border-top:1px solid rgba(31,92,74,.25)}
.sum .grand b{font-size:15px}
.sum .grand .a{font-family:var(--num);font-size:28px;font-weight:700;color:var(--accent)}
.foot{font-size:12.5px;color:var(--muted);margin-top:22px;line-height:1.7}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.skeleton{height:74px;border-radius:var(--radius);background:linear-gradient(90deg,#ece8df,#f4f1ea,#ece8df);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
@media print{
  body{background:#fff}
  .no-print{display:none!important}
  .wrap{max-width:none;padding:0}
  .card{border-color:#bbb;break-inside:avoid}
  .hero .net{font-size:32px}
}
/* ===== 2026-11-28 風格 A「溫暖好客」 ===== */
:root{--paper:#ffffff;--card:#ffffff;--ink:#222222;--muted:#6a6a6a;--line:#ebebeb;--brand:#ff385c;--brand-active:#e00b41;--danger:#c13515;--danger-soft:#fff0ed;--accent:#1d7a55;--accent-soft:#e7f5ee}
body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.card{box-shadow:0 6px 16px rgba(0,0,0,.06)}
.btn{border-radius:999px;background:var(--brand);transition:background-color .15s}
.btn:hover:not(:disabled){background:var(--brand-active)}
.btn.ghost,.btn.ghost:hover:not(:disabled){background:#fff;color:var(--ink);border:1px solid #dddddd}
input[type=text],input[type=password]{border-radius:12px;border-color:#dddddd}
input:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.slip:hover{border-color:#c1c1c1}
.skeleton{background:linear-gradient(90deg,#ececec,#f6f6f6,#ececec);background-size:200% 100%}
input[type=checkbox],input[type=radio]{accent-color:var(--ink)}
</style>

<body>
<div class="wrap" id="app" aria-live="polite"></div>
<script>
const API = 'https://rxekuiadnzjfvjcgmrxr.supabase.co/rest/v1/rpc/';
const FN = 'https://rxekuiadnzjfvjcgmrxr.supabase.co/functions/v1/docs';
const KEY = 'sb_publishable_ZQtUdhkpsPV_XhIkI1K05A_mDaLNsQQ';
const app = document.getElementById('app');
const state = { token: null, person: null, payslips: [], year: 'all', ticket: null, join: null };

try { state.token = sessionStorage.getItem('payroll_token'); state.ticket = sessionStorage.getItem('payroll_ticket'); state.join = sessionStorage.getItem('payroll_join'); } catch (e) {}
function saveJoin(j) { state.join = j; try { j ? sessionStorage.setItem('payroll_join', j) : sessionStorage.removeItem('payroll_join'); } catch (e) {}
  if (!j && /[?&]join=/.test(location.search)) { try { history.replaceState(null, '', location.pathname); } catch (e) {} } }
function saveTicket(t) { state.ticket = t; try { t ? sessionStorage.setItem('payroll_ticket', t) : sessionStorage.removeItem('payroll_ticket'); } catch (e) {} }
function saveToken(t) { state.token = t; try { t ? sessionStorage.setItem('payroll_token', t) : sessionStorage.removeItem('payroll_token'); } catch (e) {} }

async function rpc(name, body) {
  const res = await fetch(API + name, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('連線失敗（' + res.status + '）');
  return res.json();
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null ? '—' : Number(n).toLocaleString('zh-TW');
const WD = ['日', '一', '二', '三', '四', '五', '六'];
function fmtDate(s, withWd) { if (!s) return '—'; const [y, m, d] = s.split('-').map(Number); const w = withWd ? '（' + WD[new Date(y, m - 1, d).getDay()] + '）' : ''; return y + '/' + String(m).padStart(2, '0') + '/' + String(d).padStart(2, '0') + w; }
function fmtPeriod(a, b) { if (!a) return '—'; return a === b || !b ? fmtDate(a) : fmtDate(a) + ' – ' + fmtDate(b).slice(5); }
// 手機輸入法常打成全形字（Ｒ２３…）：先轉半形再去掉空白與符號，避免整串被濾掉
const halfWidth = v => String(v || '').replace(/[\uFF01-\uFF5E]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\u3000/g, ' ');
const cleanId = v => halfWidth(v).toUpperCase().replace(/\s/g, '');
// 身分證字號或居留證號：格式與檢查碼（只在送出前提示，不代表帳號存在）
function idProblem(v) {
  if (!/^[A-Z][1289A-D]\d{8}$/.test(v)) return '身分證字號要 10 碼：第一個字是英文字母，後面 9 碼數字（舊式居留證第二碼是 A～D）。';
  if (/^[A-Z][A-D]/.test(v)) return '';
  const n = 'ABCDEFGHJKLMNPQRSTUVXYWZIO'.indexOf(v[0]) + 10;
  let s = Math.floor(n / 10) + (n % 10) * 9;
  for (let i = 1; i < 9; i++) s += Number(v[i]) * (9 - i);
  s += Number(v[9]);
  return s % 10 ? '身分證字號好像有一碼打錯了，請再核對一次。' : '';
}
const brand = '<div class="brand no-print"><b>WORKS</b><span>沃克思 薪資查詢</span></div>';
// 聯絡窗口由管理員在後台「公司資料」設定；沒設就只顯示「請聯絡活動窗口」
let contactInfo;
async function showContact() {
  if (contactInfo === undefined) { try { contactInfo = await rpc('payroll_contact', {}); } catch (err) { contactInfo = null; } }
  const el = document.getElementById('contact');
  if (el && typeof contactInfo === 'string' && contactInfo) el.textContent = '（' + contactInfo + '）';
}
const BANKS = [['004', '臺灣銀行'], ['005', '土地銀行'], ['006', '合作金庫'], ['007', '第一銀行'], ['008', '華南銀行'], ['009', '彰化銀行'], ['011', '上海商銀'], ['012', '台北富邦'], ['013', '國泰世華'],
  ['016', '高雄銀行'], ['017', '兆豐銀行'], ['048', '王道銀行'], ['050', '臺灣企銀'], ['052', '渣打銀行'], ['053', '台中銀行'], ['054', '京城銀行'], ['081', '匯豐銀行'], ['102', '華泰銀行'],
  ['103', '新光銀行'], ['108', '陽信銀行'], ['118', '板信銀行'], ['147', '三信銀行'], ['700', '中華郵政'], ['803', '聯邦銀行'], ['805', '遠東銀行'], ['806', '元大銀行'], ['807', '永豐銀行'],
  ['808', '玉山銀行'], ['809', '凱基銀行'], ['810', '星展銀行'], ['812', '台新銀行'], ['816', '安泰銀行'], ['822', '中國信託'], ['823', '將來銀行'], ['824', '連線銀行'], ['826', '樂天銀行']];
// 選銀行名稱自動帶代碼；自己輸入代碼時選單跟著對上
document.addEventListener('change', ev => { if (ev.target.id === 'bk' && ev.target.value) { const bc = document.getElementById('bc'); if (bc) bc.value = ev.target.value; } });
document.addEventListener('input', ev => { if (ev.target.id === 'bc') { const bk = document.getElementById('bk'); if (bk) bk.value = BANKS.some(([c]) => c === ev.target.value) ? ev.target.value : ''; } });

function viewLogin(message) {
  state.flow = (state.flow || 0) + 1; // 離開開通頁後，晚到的開通回應不再寫入登入狀態
  document.title = '登入｜沃克思薪資查詢';
  app.innerHTML = brand + `
    <h1>查詢我的薪資</h1>
    <p class="sub">登入後可隨時查看、列印每一筆薪資明細。</p>
    <form id="f" class="card pad" style="margin-top:22px" autocomplete="off">
      <label for="nid" style="margin-top:0">身分證字號</label>
      <input id="nid" type="text" maxlength="14" autocapitalize="characters" autocomplete="username" spellcheck="false" placeholder="A123456789" required>
      <label for="pw">密碼</label>
      <div class="field">
        <input id="pw" type="password" autocomplete="current-password" required>
        <button type="button" class="toggle" id="show" aria-label="顯示密碼">顯示</button>
      </div>
      <p class="hint">合作過的夥伴，密碼預設是民國生日 7 碼，例如民國 90 年 1 月 1 日請輸入 0900101。</p>
      <div id="m">${message ? '<div class="msg warn">' + esc(message) + '</div>' : ''}</div>
      <button class="btn" id="go">登入</button>
    </form>
    ${state.join ? '<button class="btn ghost" id="toreg">第一次報名？先填基本資料</button>' : '<button class="btn ghost" id="newbie">第一次合作？建立帳號</button>'}
    <button class="link" id="toclaim" style="margin-top:10px">合作過但一直登不進去？補生日開通帳號</button>
    <p class="foot">連續輸入錯誤 10 次會鎖定 15 分鐘。忘記密碼或資料有誤，請聯絡沃克思的活動窗口<span id="contact"></span>，核對身分後會幫你把密碼重設回民國生日 7 碼。${state.join ? '' : '第一次合作的夥伴，請用活動負責人提供的報名連結填寫基本資料。'}</p>`;
  showContact();
  if (state.join) document.getElementById('toreg').addEventListener('click', () => viewRegister());
  else document.getElementById('newbie').addEventListener('click', () => viewSignup());
  document.getElementById('toclaim').addEventListener('click', () => viewClaim());
  const f = document.getElementById('f'), nid = document.getElementById('nid'), pw = document.getElementById('pw'), m = document.getElementById('m'), go = document.getElementById('go');
  nid.addEventListener('input', () => { nid.value = cleanId(nid.value); });
  document.getElementById('show').addEventListener('click', e => { const on = pw.type === 'password'; pw.type = on ? 'text' : 'password'; e.target.textContent = on ? '隱藏' : '顯示'; });
  f.addEventListener('submit', async e => {
    e.preventDefault(); m.innerHTML = '';
    nid.value = cleanId(nid.value);
    const bad = idProblem(nid.value);
    if (bad) { m.innerHTML = '<div class="msg err">' + esc(bad) + '</div>'; nid.focus(); return; }
    go.disabled = true; go.textContent = '登入中…';
    try {
      const r = await rpc('payroll_login', { p_national_id: nid.value, p_password: pw.value });
      if (r.ok) { saveToken(r.token); return state.ticket ? viewCheckin() : state.join ? viewRecruit() : viewList(); }
      else m.innerHTML = '<div class="msg err">身分證字號或密碼不正確。<div class="dim" style="margin-top:4px">請確認身分證字號沒有打錯；密碼是民國生日 7 碼，例如 0900101（改過密碼的請用新密碼）。連續錯 10 次會暫停 15 分鐘。</div>'
        + '<div style="margin-top:6px"><b>還沒報名過的新朋友沒有帳號</b>，' + (state.join ? '請按下方「第一次報名？先填基本資料」。' : '請按下方「第一次合作？建立帳號」。') + '</div></div>';
    } catch (err) { m.innerHTML = '<div class="msg err">' + esc(err.message) + '，請檢查網路後再試一次。</div>'; }
    go.disabled = false; go.textContent = '登入'; pw.value = ''; pw.focus();
  });
  nid.focus();
}

// 舊資料缺生日（沒有密碼）的人：核對姓名＋匯款帳號末 5 碼或手機，補生日後開通
function viewClaim() {
  const flow = state.flow = (state.flow || 0) + 1;
  document.title = '補生日開通帳號｜沃克思';
  app.innerHTML = brand + `

// 逐日明細：每天一張卡（班別、時薪、上下班、各倍率工時），最後彙總應發、扣款與撥款
const MULT = { regular: 1, paid_break: 1, ot_1: 1.34, ot_2: 1.67, ot_3: 2, holiday: 2, rest_1: 1.34, rest_2: 1.67, rest_3: 2.67, regular_leave: 2 };
const KIND_NAME = { regular: '一般', paid_break: '休息（照常給薪）', ot_1: '加班', ot_2: '加班', ot_3: '加班', holiday: '國定假日', rest_1: '休息日', rest_2: '休息日', rest_3: '休息日', regular_leave: '例假' };
const hrs = h => String(Math.round(Number(h) * 100) / 100);
function slipDays(p) {
  const earn = p.items.filter(i => i.kind === 'earning' && i.work_date);
  if (!earn.length) return null;
  const dates = [...new Set(earn.map(i => i.work_date))].sort();
  const ins = p.items.filter(i => i.kind === 'deduction' && i.code === 'labor_ins').reduce((a, i) => a + Number(i.amount || 0), 0);
  // 勞保自付額按天平均分攤（除不盡的零頭放最後一天）
  const per = Math.floor(ins / dates.length), remain = ins - per * dates.length;
  const att = new Map(p.attendance.map(a => [a.work_date, a]));
  const cards = dates.map((dt, k) => {
    const its = earn.filter(i => i.work_date === dt), a = att.get(dt) || {};
    const reg = its.find(i => i.code === 'regular' && i.rate != null);
    const first = its.find(i => i.rate != null && MULT[i.code]);
    const base = reg ? Number(reg.rate) : first ? Number(first.rate) / MULT[first.code] : null;
    const gross = its.reduce((t, i) => t + Number(i.amount || 0), 0), ded = per + (k === dates.length - 1 ? remain : 0);
    const [y, m, d] = dt.split('-').map(Number);
    const line = i => {
      const mult = MULT[i.code];
      const name = i.code === 'regular' && i.rate == null ? '日薪' : (KIND_NAME[i.code] || i.label);
      const detail = i.hours != null && mult && !(i.code === 'regular' && i.rate == null) ? hrs(i.hours) + ' 小時<span class="x">× ' + mult + ' 倍</span>' : (KIND_NAME[i.code] ? '' : '');
      return '<div class="ln"><span>' + esc(name) + ' ' + detail + '</span><span class="a">$' + money(i.amount) + '</span></div>';
    };
    return '<div class="card day">'
      + '<div class="dh"><span class="dd">' + m + '/' + d + '</span><span class="wd">週' + WD[new Date(y, m - 1, d).getDay()] + '</span>'
      + (p.role ? '<span class="tag">' + esc(p.role) + '</span>' : '')
      + (base ? '<span class="rate">時薪 <b>$' + money(Math.round(base * 100) / 100) + '</b></span>' : '') + '</div>'
      + (a.clock_in ? '<div class="tm">' + esc(a.clock_in) + '–' + esc(a.clock_out || '') + (a.overnight ? '<span class="dim">（翌日）</span>' : '')
          + '<span class="sep">|</span>計薪 ' + (a.minutes != null ? hrs(a.minutes / 60) : '—') + ' 小時'
          + (Number(a.break_minutes) ? '<span class="dim">（休息 ' + esc(a.break_minutes) + ' 分' + (its.some(i => i.code === 'paid_break') ? '不計工時，給薪見下方' : '不計') + '）</span>' : '') + '</div>' : '')
      + '<div class="lines">' + its.map(line).join('') + '</div>'
      + '<div class="df"><span>應發 <span class="a">$' + money(gross) + '</span>' + (ded ? '　勞保 <span class="a">−$' + money(ded) + '</span>' : '') + '</span>'
      + '<span class="pay">當日撥款 <span class="a">$' + money(gross - ded) + '</span></span></div></div>';
  }).join('');
  const others = p.items.filter(i => (i.kind === 'earning' && !i.work_date) || i.kind === 'allowance');
  const otherDed = p.items.filter(i => i.kind === 'deduction' && i.code !== 'labor_ins');
  const payable = Number(p.gross || 0) + Number(p.allowances || 0);
  return cards
    + (others.length ? '<div class="card day"><div class="dh"><span class="dd" style="font-size:16px">其他應發</span></div><div class="lines">' + others.map(i => '<div class="ln"><span>' + esc(i.label) + '</span><span class="a">$' + money(i.amount) + '</span></div>').join('') + '</div></div>' : '')
    + '<div class="card sum">'
    + '<div class="row2"><span>應發合計（' + dates.length + ' 天）</span><span class="a">$' + money(payable) + '</span></div>'
    + (ins ? '<div class="row2"><span>勞保、就保自付額</span><span class="a">−$' + money(ins) + '</span></div>' : '')
    + otherDed.map(i => '<div class="row2"><span>' + esc(i.label) + '</span><span class="a">−$' + money(i.amount) + '</span></div>').join('')
    + '<div class="grand"><b>合計撥款</b><span class="a">$' + money(p.net) + '</span></div></div>';
}

function viewPassword() {
  document.title = '更改密碼｜沃克思';
  app.innerHTML = brand + `
    <button class="link" id="back">← 返回</button>
    <h1 style="margin-top:8px">更改密碼</h1>
    <form id="f" class="card pad" style="margin-top:18px">
      <label for="o" style="margin-top:0">目前的密碼</label><input id="o" type="password" autocomplete="current-password" required>
      <label for="n">新密碼（至少 7 個字，可用 7 位數字）</label><input id="n" type="password" autocomplete="new-password" minlength="7" required>
      <label for="n2">再輸入一次新密碼</label><input id="n2" type="password" autocomplete="new-password" minlength="7" required>
      <div id="m"></div>
      <button class="btn" id="go">儲存新密碼</button>
    </form>`;
  const m = document.getElementById('m'), go = document.getElementById('go');
  document.getElementById('back').addEventListener('click', viewProfile);
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault(); m.innerHTML = '';
    const o = document.getElementById('o').value, n = document.getElementById('n').value, n2 = document.getElementById('n2').value;
    if (n !== n2) { m.innerHTML = '<div class="msg err">兩次輸入的新密碼不一樣。</div>'; return; }
    if (Array.from(n).length < 7) { m.innerHTML = '<div class="msg err">新密碼至少要 7 個字。</div>'; return; }
    go.disabled = true;
    try {
      const r = await rpc('payroll_change_password', { p_token: state.token, p_old: o, p_new: n });
      if (r.ok) { if (state.person) state.person.default_password = false; viewProfile('密碼已更新。'); return; }
      if (r.error === 'session') { saveToken(null); return viewLogin('登入已逾時，請重新登入。'); }
      m.innerHTML = '<div class="msg err">' + (r.error === 'too_short' ? '新密碼至少要 7 個字。' : r.error === 'locked' ? '目前的密碼錯太多次，請 ' + Number(r.retry_after_minutes || 15) + ' 分鐘後再試。' : '目前的密碼不正確。') + '</div>';
    } catch (err) { m.innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; }
    go.disabled = false;

async function fnCall(body) { const res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify(body) }); return res.json(); }
// 上傳前在手機上先縮成長邊 1000px 的 JPEG，目標約 50KB（字仍清楚，又不佔系統空間）；PDF 與無法解碼的格式照原檔上傳
async function prepFile(file) {
  if (file.type === 'application/pdf') return file;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    let out = null;
    for (const q of [0.7, 0.6, 0.5, 0.42]) {
      out = await new Promise(r => c.toBlob(b => r(b), 'image/jpeg', q));
      if (out && out.size <= 55 * 1024) return out;
    }
    // 畫面很雜還壓不下：縮到 850px 再試一次
    const c2 = document.createElement('canvas'), k2 = 850 / Math.max(c.width, c.height);
    if (k2 < 1) { c2.width = Math.round(c.width * k2); c2.height = Math.round(c.height * k2); c2.getContext('2d').drawImage(c, 0, 0, c2.width, c2.height);
      const o2 = await new Promise(r => c2.toBlob(b => r(b), 'image/jpeg', 0.5)); if (o2 && (!out || o2.size < out.size)) out = o2; }
    return out || file;
  } catch (e) { return file; }
}
async function uploadDoc(kind, file) {
  const blob = await prepFile(file), type = blob.type || file.type;
  const a = await fnCall({ action: 'upload_url', token: state.token, kind, content_type: type });
  if (!a.ok) throw new Error(a.error === 'session' ? '登入已逾時，請重新登入。' : a.error === 'bad_type' ? '請上傳照片或 PDF。' : '無法上傳，請稍後再試。');
  const put = await fetch(a.signed_url, { method: 'PUT', headers: { 'Content-Type': type }, body: blob });
  if (!put.ok) throw new Error(put.status === 413 ? '檔案太大（上限 8 MB）。' : '上傳失敗，請再試一次。');
  const c = await fnCall({ action: 'confirm', token: state.token, kind, path: a.path });
  if (!c.ok) throw new Error('上傳後確認失敗，請再試一次。');
}

function bindDocs(after) {

    const f = inp.files[0], st = document.getElementById('st-' + inp.dataset.doc); if (!f) return;

    <button class="link" style="margin-left:14px" data-join="${esc(e.join)}">修改報名</button></div>`).join('');
}

async function viewRecruit(message) {
  document.title = '活動報名｜沃克思';
  app.innerHTML = brand + '<div class="skeleton" style="height:180px"></div><div class="skeleton"></div>';
  let pub;
  try { pub = await rpc('payroll_event_public', { p_join: state.join }); } catch (err) { app.innerHTML = brand + '<div class="msg err">' + esc(err.message) + '</div><button class="btn ghost" onclick="viewRecruit()">再試一次</button>'; return; }
  if (!pub.ok) { saveJoin(null); return state.token ? viewList() : viewLogin(PERR.bad_join); }
  const ev = pub.event, form = ev.form || {}, qs = form.questions || [];
  let mine = null, hasPhoto = false, docs = {}, missingDocs = [], linked = false;
  if (state.token) {
    const r = await rpc('payroll_my_application', { p_token: state.token, p_join: state.join });
    if (!r.ok) { saveToken(null); } else { mine = r.application; hasPhoto = r.has_photo; docs = r.documents || {}; missingDocs = r.missing_docs || []; linked = r.linked; }
  }
  const my = (mine && mine.shifts) || {}, ans = (mine && mine.answers) || {};
  const days = {}; pub.shifts.forEach(s => (days[s.work_date] = days[s.work_date] || []).push(s));
  // 每個班次都額滿：先說清楚，不讓新朋友填完資料才發現沒班可報
  // 報名方式：pool 名單制（不列班表）／plan 專屬連結（單一方案）／plans 方案單選／pick 自選班次
  const mode = pub.mode || 'pick', plans = pub.plans || [], isPlan = mode === 'plan' || mode === 'plans';
  const sById = {}; pub.shifts.forEach(s => { sById[s.id] = s; });
  const planShifts = p => (p.shift_ids || []).map(id => sById[id]).filter(Boolean).sort((a, b) => (a.work_date + a.start).localeCompare(b.work_date + b.start));
  const allFull = mode === 'pool' ? false : isPlan ? plans.length > 0 && plans.every(p => p.full) : pub.shifts.length > 0 && pub.shifts.every(s => s.accepted >= s.headcount);
  const noShift = mode === 'pool' ? false : isPlan ? !plans.length : !pub.shifts.length;
  const planLines = p => planShifts(p).map(s => esc(fmtDate(s.work_date, true).slice(5) + ' ' + shiftTime(s) + (s.role ? '　' + s.role : ''))).join('<br>');
  const planInfo = p => (p.full ? '已額滿' : p.headcount ? '需要 ' + p.headcount + ' 人' : '') + (planShifts(p).length > 1 ? (p.full || p.headcount ? '　' : '') + '整組報名，以上班次都要上' : '');
  const open = ev.recruiting && !allFull && !noShift;
  const head = `<p class="sub">${esc(ev.employer)}</p><h1>${esc(ev.name)}</h1>
    <p class="sub">${esc(fmtPeriod(ev.start_date, ev.end_date))}${ev.location ? '　' + esc(ev.location) : ''}</p>
    ${ev.description ? '<div class="card pad" style="margin-top:14px;white-space:pre-wrap;font-size:14px">' + esc(ev.description) + '</div>' : ''}
    ${message ? '<div class="msg ok">' + esc(message) + '</div>' : ''}`;
  if (!state.token) {
    app.innerHTML = brand + head + `
      ${!ev.recruiting ? '<div class="msg warn">這場活動目前不開放報名。</div>' : allFull ? '<div class="msg warn">這場活動的班次都已額滿，目前不收新報名。有名額釋出時活動負責人會再通知。</div>' : noShift ? '<div class="msg warn">這場活動還沒開放班次，請等活動負責人通知後再報名。</div>' : ''}
      ${mode === 'pool' ? '<div class="card pad" style="margin-top:14px;font-size:14px">報名後由活動負責人安排班次，排好會用 LINE 或 Email 通知你。</div>'
        : isPlan ? (plans.length ? '<h2>' + (mode === 'plan' ? '報名班次' : '可報名的方案') + '</h2>' + plans.map(p => `<div class="sopt off" style="cursor:default"><div><div class="t">${esc(p.name)}</div><div class="d" style="line-height:1.6">${planLines(p)}${planInfo(p) ? '<br>' + esc(planInfo(p)) : ''}</div></div></div>`).join('') : '')
        : pub.shifts.length ? '<h2>班次</h2>' + Object.keys(days).sort().map(dk => '<div class="sday">' + esc(fmtDate(dk, true)) + '</div>' + days[dk].map(s => `<div class="sopt off" style="cursor:default"><div><div class="t">${esc(shiftTime(s))}　${esc(s.role || '')}</div><div class="d">${s.rate || ev.default_hourly_rate ? '時薪 ' + money(s.rate || ev.default_hourly_rate) + ' 元　' : ''}${s.accepted >= s.headcount ? '已額滿' : '需要 ' + s.headcount + ' 人'}</div></div></div>`).join('')).join('') : ''}
      ${open ? '<button class="btn" id="reg">第一次報名，填寫基本資料</button>' : ''}
      <button class="btn ghost" id="login">${open ? '我已經有帳號，登入報名' : '已報名的人登入查看結果'}</button>
      ${open ? '<p class="foot">基本資料只要填一次，之後報名其他活動直接登入即可。</p>' : ''}`;
    if (open) document.getElementById('reg').addEventListener('click', () => viewRegister());
    document.getElementById('login').addEventListener('click', () => viewLogin(open ? '登入後繼續報名。' : null));
    return;
  }
  const lockedAccepted = Object.values(my).includes('accepted');
  app.innerHTML = brand + head + `
    ${ev.recruiting ? '' : '<div class="msg warn">這場活動目前不開放報名，以下是你的報名結果。</div>'}
    ${ev.recruiting && allFull && !mine ? '<div class="msg warn">這場活動的班次都已額滿，目前不收新報名。</div>' : ''}
    ${missingDocs.length && ev.recruiting ? '<div class="msg warn">還缺：' + esc(missingDocs.map(k => ({ id_front: '身分證正面', id_back: '身分證反面', bankbook: '存摺封面' })[k] || k).join('、')) + '。三項證件都上傳後才能報名，<a href="#docs">到下方上傳</a>。</div>' : ''}
    ${pub.require_line && !linked && ev.recruiting ? '<h2>先綁定 LINE</h2><div class="msg warn">這場活動要先綁定 LINE 才能報名，錄取和上班時間會用 LINE 通知你。</div><div class="card pad" id="linebox"><p class="sub">載入中…</p></div>' : ''}
    <form id="f">
      ${mode === 'pool' ? '<h2>班次</h2>' + ((mine && (mine.shift_list || []).some(s => s.status === 'accepted'))
          ? (mine.shift_list || []).filter(s => s.status === 'accepted').map(s => `<div class="sopt off" style="cursor:default;opacity:1"><div style="flex:1"><div class="t">${esc(fmtDate(s.work_date, true).slice(5))}　${esc(shiftTime(s))}　${esc(s.role || '')}</div></div><span class="pill ok">已排入</span></div>`).join('')
          : '<div class="card pad" style="font-size:14px">' + (mine ? '已收到你的報名。' : '') + '活動負責人會安排班次，排好會用 LINE 或 Email 通知你，也會顯示在這裡。</div>')
      : isPlan ? (plans.length ? '<h2>' + (mode === 'plan' ? '報名班次' : '選擇方案（選一個）') + '</h2>' + plans.map(p => {
          const cur = mine && mine.plan_id === p.id, off = !ev.recruiting || lockedAccepted || (p.full && !cur);
          return `<label class="sopt ${off && !cur ? 'off' : ''}"><input type="radio" name="plan" value="${esc(p.id)}" ${cur || (mode === 'plan' && !lockedAccepted) ? 'checked' : ''} ${off ? 'disabled' : ''}>
            <div style="flex:1"><div class="t">${esc(p.name)}</div><div class="d" style="line-height:1.6">${planLines(p)}${planInfo(p) ? '<br>' + esc(planInfo(p)) : ''}</div></div>
            ${cur ? '<span class="pill ' + (lockedAccepted ? 'ok' : '') + '">' + (lockedAccepted ? '已錄取' : '已報名') + '</span>' : ''}</label>`; }).join('')
          + (mine && mine.plan_id && !plans.some(p => p.id === mine.plan_id) ? '<div class="msg warn">你目前報名的是其他方案，改選這裡的方案會取代原本的報名。</div>' : '') : '')
      : pub.shifts.length ? '<h2>選擇想上的班次（可複選）</h2>' + Object.keys(days).sort().map(dk => '<div class="sday">' + esc(fmtDate(dk, true)) + '</div>' + days[dk].map(s => {
        const st = my[s.id], full = s.accepted >= s.headcount && st !== 'accepted', off = st === 'accepted' || !ev.recruiting || (full && !st);
        return `<label class="sopt ${off ? 'off' : ''}"><input type="checkbox" name="sh" value="${esc(s.id)}" ${st ? 'checked' : ''} ${off ? 'disabled' : ''}>
          <div style="flex:1"><div class="t">${esc(shiftTime(s))}　${esc(s.role || '')}</div><div class="d">${s.rate || ev.default_hourly_rate ? '時薪 ' + money(s.rate || ev.default_hourly_rate) + ' 元　' : ''}${full ? '已額滿' : '需要 ' + s.headcount + ' 人'}${s.note ? '　' + esc(s.note) : ''}</div></div>
          ${st ? '<span class="pill ' + SST[st][1] + '">' + SST[st][0] + '</span>' : ''}</label>`; }).join('')).join('') : ''}
      ${qs.length ? '<h2>報名問題</h2><div class="card pad" style="padding-top:2px">' + qs.map(q => `<label for="q_${esc(q.id)}">${esc(q.label)}${q.required ? '' : '（選填）'}</label>` + (q.type === 'choice'
        ? `<select id="q_${esc(q.id)}" data-q="${esc(q.id)}"><option value="">請選擇</option>${(q.options || []).map(o => `<option ${ans[q.id] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
        : `<input id="q_${esc(q.id)}" type="text" data-q="${esc(q.id)}" value="${esc(ans[q.id] || '')}">`)).join('') + '</div>' : ''}
      ${form.experience ? `<h2>相關經驗</h2><textarea id="exp" style="width:100%;min-height:96px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px" placeholder="曾擔任過的活動、品牌與工作內容">${esc((mine && mine.experience) || '')}</textarea>` : ''}
      ${missingDocs.length && ev.recruiting ? '<h2 id="docs">證件影本（必填）</h2><div class="msg warn">報名前要先上傳身分證正反面和存摺封面，資料只有你本人和沃克思的管理人員看得到。</div>' + docsBlock(docs) : ''}
      ${form.photo ? `<h2>個人照片</h2><div class="card pad" style="padding-top:4px;padding-bottom:4px"><div class="doc"><div><div>清楚的半身生活照</div><div class="st ${hasPhoto ? 'ok' : ''}" id="st-photo">${hasPhoto ? '已上傳' : '尚未上傳'}</div></div><label class="filebtn">${hasPhoto ? '重新上傳' : '選擇照片'}<input type="file" accept="image/*" data-doc="photo"></label></div></div>` : ''}
      <div id="m"></div>
      ${ev.recruiting ? `<button class="btn" id="go">${mine ? '更新報名' : '送出報名'}</button>` : ''}
    </form>
    ${mine && !lockedAccepted && ev.recruiting ? '<button class="link" id="wd" style="margin-top:10px">取消報名</button>' : ''}
    <button class="btn ghost" id="tolist">查看我的排班與薪資</button>
    <p class="foot">錄取結果會顯示在「我的排班」。已錄取的班次如需取消，請聯絡活動負責人。</p>`;
  bindDocs();
  if (document.getElementById('linebox')) renderLine();
  document.getElementById('tolist').addEventListener('click', viewList);
  const wd = document.getElementById('wd');
  if (wd) wd.addEventListener('click', async () => {
    if (!wd.dataset.sure) { wd.dataset.sure = '1'; wd.textContent = '確定要取消報名？再按一次'; return; }
    const r = await rpc('payroll_withdraw', { p_token: state.token, p_join: state.join });
    viewRecruit(r.ok ? '已取消報名。' : '無法取消，已錄取的班次請聯絡活動負責人。');
  });
  const f = document.getElementById('f');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const m = document.getElementById('m'), go = document.getElementById('go'); m.innerHTML = ''; go.disabled = true;
    const answers = {}; f.querySelectorAll('[data-q]').forEach(el => { answers[el.dataset.q] = el.value; });
    const shift_ids = [...f.querySelectorAll('input[name=sh]:checked')].map(x => x.value);
    const pk = f.querySelector('input[name=plan]:checked');
    const exp = document.getElementById('exp');
    try {
      const r = await rpc('payroll_apply', { p_token: state.token, p_join: state.join, p_data: { shift_ids, plan_id: pk ? pk.value : null, answers, experience: exp ? exp.value : '' } });
      if (r.ok) { window.scrollTo(0, 0); return viewRecruit(mine ? '報名已更新。' : '已送出報名。錄取結果會顯示在「我的排班」。'); }
      if (r.error === 'session') { saveToken(null); return viewLogin('登入已逾時，請重新登入。'); }
      m.innerHTML = '<div class="msg err">' + esc({ closed: '這場活動目前不開放報名。', no_shift: '請至少選一個班次。', bad_shift: '班次有變動，請重新整理頁面。', missing_answer: '請回答「' + (r.question || '') + '」。', bad_answer: '請重新選擇「' + (r.question || '') + '」。', missing_experience: '請填寫相關經驗。', missing_photo: '請上傳個人照片。', missing_docs: '請先上傳' + ((r.missing || []).map(k => ({ id_front: '身分證正面', id_back: '身分證反面', bankbook: '存摺封面' })[k]).join('、') || '證件影本') + '，三項都上傳後才能報名。', bad_join: PERR.bad_join, no_plan: '請選一個方案。', bad_plan: '方案有變動，請重新整理頁面。', plan_full: '這個方案已額滿，請選其他方案。', has_accepted: '你已經錄取了，要更換班次請聯絡活動負責人。', need_line: '請先完成上方的 LINE 綁定再送出報名。' }[r.error] || '送出失敗，請再試一次。') + '</div>';
    } catch (err) { m.innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; }
    go.disabled = false;
  });
}

async function viewContract(appId) {
  document.title = '勞動契約｜沃克思';
  app.innerHTML = brand + '<div class="skeleton" style="height:300px"></div>';
  const r = await rpc('payroll_contract', { p_token: state.token, p_app: appId });
  if (!r.ok) { if (r.error === 'session') { saveToken(null); return viewLogin('登入已逾時，請重新登入。'); } return viewList(); }
  app.innerHTML = brand + `<button class="link no-print" id="back">← 返回</button>
    <h1 style="margin-top:8px">勞動契約</h1>
    <p class="sub">${r.accepted_at ? '你已於 ' + esc(new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(r.accepted_at))) + ' 確認同意。' : '請完整閱讀後勾選同意。錄取的班次如有變動，需要重新確認。'}</p>
    <div class="card pad contract" style="margin-top:16px">${esc(r.text || '目前沒有已錄取的班次。')}</div>
    ${r.accepted_at || !r.text ? '<button class="btn ghost no-print" id="print">列印／存成 PDF</button>' : `<label class="check no-print"><input id="ok" type="checkbox"><span>我已閱讀並同意以上契約內容。</span></label><div id="m"></div><button class="btn no-print" id="go">確認同意</button>`}`;
  document.getElementById('back').addEventListener('click', viewList);
  const pr = document.getElementById('print'); if (pr) pr.addEventListener('click', () => window.print());
  const go = document.getElementById('go');
  if (go) go.addEventListener('click', async () => {
    if (!document.getElementById('ok').checked) { document.getElementById('m').innerHTML = '<div class="msg err">請先勾選同意。</div>'; return; }
    go.disabled = true;
    const r2 = await rpc('payroll_accept_contract', { p_token: state.token, p_app: appId, p_hash: r.hash });
    if (r2.ok) return viewContract(appId);
    if (r2.error === 'changed') { alert('契約內容剛剛有更新，請重新閱讀後再確認。'); return viewContract(appId); }
    document.getElementById('m').innerHTML = '<div class="msg err">確認失敗，請重新整理後再試。</div>'; go.disabled = false;
  });
}

async function renderLine(code) {
  const box = document.getElementById('linebox'); if (!box) return;
  let st;
  try { st = await rpc('payroll_line_status', { p_token: state.token }); } catch (err) { box.innerHTML = '<p class="sub">' + esc(err.message) + '</p>'; return; }
  if (!st.ok) return;
  const id = st.basic_id;
  if (!id) { box.innerHTML = '<p class="sub">LINE 通知尚未開放。</p>'; return; }
  if (st.linked) {
    box.innerHTML = `<p style="color:var(--accent);font-weight:600">已綁定 LINE</p><p class="sub" style="margin-top:4px">錄取、上班前一天提醒、忘記簽退和薪資單發布都會傳到 LINE。</p><button class="link" id="unlink" style="margin-top:8px">解除綁定</button>`;
    const u = document.getElementById('unlink');
    u.addEventListener('click', async () => { if (!u.dataset.sure) { u.dataset.sure = '1'; u.textContent = '確定解除？再按一次'; return; } await rpc('payroll_line_unlink', { p_token: state.token }); renderLine(); });
    return;
  }
  if (!code) {
    box.innerHTML = `<p class="sub">綁定後，錄取通知、上班前一天提醒和薪資單發布都會直接傳到你的 LINE。</p><button class="btn" id="mkcode">開始綁定</button>`;
    document.getElementById('mkcode').addEventListener('click', async () => { const r = await rpc('payroll_line_code', { p_token: state.token }); if (r.ok) renderLine(r.code); });
    return;
  }
  const enc = encodeURIComponent(id);
  box.innerHTML = `<p class="sub">你的綁定碼（15 分鐘內有效）</p>
    <div style="font-family:var(--num);font-size:40px;font-weight:700;letter-spacing:.18em;margin:4px 0 14px">${esc(code)}</div>
    <a class="btn ghost" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:0" href="https://line.me/R/ti/p/${enc}" target="_blank" rel="noopener">1. 加入沃克思 LINE 好友（${esc(id)}）</a>
    <a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:10px" href="https://line.me/R/oaMessage/${enc}/?${encodeURIComponent('綁定 ' + code)}" target="_blank" rel="noopener">2. 把綁定碼傳給官方帳號</a>
    <p class="hint">在 LINE 收到「綁定完成」後，回到這頁按下面的按鈕。</p>
    <button class="btn ghost" id="recheck">我已經傳送了，重新檢查</button>`;
  document.getElementById('recheck').addEventListener('click', async () => { const r = await rpc('payroll_line_status', { p_token: state.token }); if (r.linked) renderLine(); else document.querySelector('#linebox .hint').textContent = '還沒收到綁定碼。請確認已加入好友，並把 ' + code + ' 傳給官方帳號。'; });
}

async function viewCheckin(action, ack) {
  document.title = '簽到退｜沃克思';
  if (!action) app.innerHTML = brand + '<div class="skeleton" style="height:220px"></div>';
  let r;
  try { r = await rpc('payroll_clock', { p_token: state.token, p_ticket: state.ticket, p_action: action || 'status', p_ack: !!ack }); }
  catch (err) { app.innerHTML = brand + '<div class="msg err">' + esc(err.message) + '</div><button class="btn ghost" onclick="viewCheckin()">再試一次</button>'; return; }
  if (r.error === 'session') { saveToken(null); return viewLogin('請先登入，登入後就可以簽到。'); }
  if (r.error === 'ticket') { saveTicket(null); app.innerHTML = brand + '<h1>簽到連結已失效</h1><p class="sub" style="margin-top:8px">請重新掃描現場的 QR 碼。</p><button class="btn ghost" onclick="viewList()">查看我的薪資</button>'; return; }
  if (!r.error && r.block && (r.state || 'none') === 'none') r.error = r.block;
  // 提早到、遲到、超過表定下班：先讓本人看清楚計薪方式並確認，才完成簽到退
  if (r.error === 'need_ack' && r.notice) {
    const title = { early: '提早到場', late: '遲到', overtime: '超過表定下班' }[r.notice.kind] || '請確認';
    app.innerHTML = brand + `
      <p class="sub">${esc(r.event || '')}</p>
      <h1>${esc(title)}</h1>
      <div class="card hero" style="margin-top:18px;text-align:left">
        <p style="margin:0;line-height:1.8">${esc(r.notice.text)}</p>
      </div>
      <button class="btn big ${action === 'out' ? 'out' : ''}" id="ack">我知道了，${action === 'out' ? '簽退' : '簽到'}</button>
      <button class="btn ghost" id="back">先不要</button>
      <p class="foot">按下確認後會記錄你看到的這段說明與時間。對計薪有疑問請當場告訴現場負責人。</p>`;
    document.getElementById('ack').addEventListener('click', ev => { ev.target.disabled = true; viewCheckin(action, true); });
    document.getElementById('back').addEventListener('click', () => viewCheckin());
    return;
  }
  const note = { not_scheduled: '你今天沒有被排到這場活動的班，無法簽到。如果現場臨時需要你支援，請請負責人在後台補登出勤。', not_event_day: '今天不在這場活動的日期內，無法簽到。', already_in: '你已經簽到過了。', already_done: '今天已經完成簽到與簽退。', not_in: '找不到簽到紀錄，請先簽到。' }[r.error];
  const st = r.state || 'none';
  app.innerHTML = brand + `
    <p class="sub">${esc(r.event || '')}</p>
    <h1>${st === 'in' ? '上班中' : st === 'done' ? '今天已完成' : '尚未簽到'}</h1>
    <div class="card hero" style="margin-top:18px">
      <div class="label">現在時間</div>
      <div class="clock">${esc(r.now || '--:--')}</div>
      <dl class="kv" style="margin-top:16px;text-align:left">
        ${r.sched_in ? '<dt>表定時段</dt><dd>' + esc(r.sched_in) + '–' + esc(r.sched_out || '') + '</dd>' : ''}
        <dt>簽到</dt><dd>${esc(r.clock_in || '—')}</dd>
        <dt>簽退</dt><dd>${esc(r.clock_out || '—')}</dd>
      </dl>
    </div>
    ${r.ok && r.done ? '<div class="msg ok">' + (r.done === 'in' ? '簽到成功，時間 ' + esc(r.clock_in) + '。' : '簽退成功，時間 ' + esc(r.clock_out) + '。辛苦了。') + '</div>' : ''}
    ${note ? '<div class="msg warn">' + esc(note) + '</div>' : ''}
    ${r.error === 'not_event_day' || r.error === 'not_scheduled' || st === 'done' ? '' : st === 'in'
      ? '<button class="btn big out" id="act" data-a="out">簽退</button>'
      : '<button class="btn big" id="act" data-a="in">簽到</button>'}
    <button class="btn ghost" id="tolist">查看我的薪資</button>
    <p class="foot">簽到退時間以伺服器時間為準，記錄到分鐘，並依勞動基準法第 30 條保存 5 年。時間有誤請當場告訴現場負責人。</p>`;
  document.getElementById('tolist').addEventListener('click', viewList);
  const act = document.getElementById('act');
  if (act) act.addEventListener('click', () => {
    if (act.dataset.a === 'out' && !act.dataset.sure) { act.dataset.sure = '1'; act.textContent = '確定要簽退？再按一次'; return; }
    act.disabled = true; viewCheckin(act.dataset.a);
  });
}

(async function boot() {
  const qs = new URLSearchParams(location.search), code = qs.get('k'), join = qs.get('join');
  let codeMsg = null;
  // 報名碼留在網址：從 LINE 轉開 Safari、重新整理、轉傳連結都還帶得到（報名碼本來就公開貼在群組）
  if (join) saveJoin(join);
  if (code) {
    try { history.replaceState(null, '', location.pathname + (join ? '?join=' + encodeURIComponent(join) : '')); } catch (e) {}
    try {
      const r = await rpc('payroll_checkin_ticket', { p_code: code });
      if (r.ok) saveTicket(r.ticket);
      else { saveTicket(null); codeMsg = r.error === 'expired' ? 'QR 碼已過期，請重新掃描現場的 QR 碼。' : 'QR 碼無法辨識，請重新掃描。'; }
    } catch (err) { codeMsg = '網路連線失敗，請重新掃描 QR 碼。'; }
  }
  if (state.ticket && code && state.token) return viewCheckin();
  if (state.join && join && !codeMsg) return viewRecruit();
  if (!state.token) return viewLogin(codeMsg || (state.ticket ? '請先登入，登入後就可以簽到。' : null));
  if (state.ticket && code) return viewCheckin();
  viewList();
})();
</script>
</body>
</html>
