<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>薪資查詢｜沃克思</title>
<style>
:root{
  --paper:#f5f2ec; --card:#fffdf9; --ink:#1d1c1a; --muted:#6f6b63; --line:#e3ded3;
  --accent:#1f5c4a; --accent-soft:#e4efe9; --warn:#8a5a00; --warn-soft:#fbf1d9; --danger:#a3271f; --danger-soft:#fbe6e3;
  --radius:14px; --num:"SF Mono","Roboto Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:baseline;gap:10px;margin:8px 0 28px}
.brand b{font-size:15px;letter-spacing:.18em}
.brand span{font-size:13px;color:var(--muted)}
h1{font-size:26px;line-height:1.25;margin:0 0 6px;font-weight:700;letter-spacing:.01em}
h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.12em;margin:28px 0 10px}
p{margin:0}
.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.pad{padding:18px}
label{display:block;font-size:13px;color:var(--muted);margin:16px 0 6px}
.field{position:relative}
input[type=text],input[type=password]{width:100%;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:17px;letter-spacing:.04em;outline:none}
input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(29,28,26,.08)}
.toggle{position:absolute;right:6px;top:6px;height:40px;padding:0 12px;border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;border-radius:8px}
.btn{display:block;width:100%;height:52px;border:0;border-radius:10px;background:var(--ink);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:22px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.small{height:40px;width:auto;padding:0 14px;font-size:14px;margin:0}
.link{background:none;border:0;padding:8px 0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.msg{margin-top:14px;padding:11px 13px;border-radius:10px;font-size:14px}
.msg.err{background:var(--danger-soft);color:var(--danger)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.ok{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:22px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 0;font-size:15px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.slip{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;cursor:pointer}
.slip:hover{border-color:#cfc8b9}
.slip .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.slip .name{font-weight:600;font-size:16px}
.slip .amt{font-family:var(--num);font-size:19px;font-weight:600;white-space:nowrap}
.slip .meta{font-size:13px;color:var(--muted);margin-top:4px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.hero{padding:22px 18px 20px;text-align:center}
.hero .label{font-size:13px;color:var(--muted);letter-spacing:.12em}
.hero .net{font-family:var(--num);font-size:44px;font-weight:700;line-height:1.15;margin-top:4px;letter-spacing:-.01em}
select{width:100%;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:17px}
input[type=date],input[type=tel],input[type=email]{width:100%;height:52px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:17px;outline:none}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);margin-top:18px;line-height:1.6}
.check input{width:20px;height:20px;margin-top:2px;flex:0 0 auto}
.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.doc .st{font-size:13px;color:var(--muted)}.doc .st.ok{color:var(--accent)}
.filebtn{display:inline-flex;align-items:center;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;cursor:pointer;white-space:nowrap;background:#fff}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0}
.filebtn:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px rgba(29,28,26,.08)}
.clock{font-family:var(--num);font-size:56px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.btn.big{height:64px;font-size:19px}
.btn.out{background:var(--accent)}
.hero .net small{font-size:18px;font-weight:500;margin-right:4px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-weight:400}
tr:last-child td{border-bottom:0}
th{font-size:12px;color:var(--muted);letter-spacing:.06em}
.r{text-align:right;font-family:var(--num);white-space:nowrap}
.dim{color:var(--muted);font-size:12.5px}
.total td{font-weight:700;border-top:1px solid var(--ink);border-bottom:0}
.neg{color:var(--danger)}
.foot{font-size:12.5px;color:var(--muted);margin-top:22px;line-height:1.7}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.skeleton{height:74px;border-radius:var(--radius);background:linear-gradient(90deg,#ece8df,#f4f1ea,#ece8df);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
@media print{
  body{background:#fff}
  .no-print{display:none!important}
  .wrap{max-width:none;padding:0}
  .card{border-color:#bbb;break-inside:avoid}
  .hero .net{font-size:32px}
}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<script>
const API = 'https://rxekuiadnzjfvjcgmrxr.supabase.co/rest/v1/rpc/';
const FN = 'https://rxekuiadnzjfvjcgmrxr.supabase.co/functions/v1/docs';
const KEY = 'sb_publishable_ZQtUdhkpsPV_XhIkI1K05A_mDaLNsQQ';
const app = document.getElementById('app');
const state = { token: null, person: null, payslips: [], year: 'all', ticket: null, join: null };

try { state.token = sessionStorage.getItem('payroll_token'); state.ticket = sessionStorage.getItem('payroll_ticket'); state.join = sessionStorage.getItem('payroll_join'); } catch (e) {}
function saveJoin(j) { state.join = j; try { j ? sessionStorage.setItem('payroll_join', j) : sessionStorage.removeItem('payroll_join'); } catch (e) {} }
function saveTicket(t) { state.ticket = t; try { t ? sessionStorage.setItem('payroll_ticket', t) : sessionStorage.removeItem('payroll_ticket'); } catch (e) {} }
function saveToken(t) { state.token = t; try { t ? sessionStorage.setItem('payroll_token', t) : sessionStorage.removeItem('payroll_token'); } catch (e) {} }

async function rpc(name, body) {
  const res = await fetch(API + name, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('連線失敗（' + res.status + '）');
  return res.json();
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null ? '—' : Number(n).toLocaleString('zh-TW');
const WD = ['日', '一', '二', '三', '四', '五', '六'];
function fmtDate(s, withWd) { if (!s) return '—'; const [y, m, d] = s.split('-').map(Number); const w = withWd ? '（' + WD[new Date(y, m - 1, d).getDay()] + '）' : ''; return y + '/' + String(m).padStart(2, '0') + '/' + String(d).padStart(2, '0') + w; }
function fmtPeriod(a, b) { if (!a) return '—'; return a === b || !b ? fmtDate(a) : fmtDate(a) + ' – ' + fmtDate(b).slice(5); }
const brand = '<div class="brand no-print"><b>WORKS</b><span>沃克思 薪資查詢</span></div>';

function viewLogin(message) {
  document.title = '登入｜沃克思薪資查詢';
  app.innerHTML = brand + `
    <h1>查詢我的薪資</h1>
    <p class="sub">登入後可隨時查看、列印每一筆薪資明細。</p>
    <form id="f" class="card pad" style="margin-top:22px" autocomplete="off">
      <label for="nid" style="margin-top:0">身分證字號</label>
      <input id="nid" type="text" maxlength="10" autocapitalize="characters" autocomplete="username" spellcheck="false" placeholder="A123456789" required>
      <label for="pw">密碼</label>
      <div class="field">
        <input id="pw" type="password" autocomplete="current-password" required>
        <button type="button" class="toggle" id="show" aria-label="顯示密碼">顯示</button>
      </div>
      <p class="hint">第一次登入的密碼是民國生日 7 碼，例如民國 90 年 1 月 1 日請輸入 0900101。</p>
      <div id="m">${message ? '<div class="msg warn">' + esc(message) + '</div>' : ''}</div>
      <button class="btn" id="go">登入</button>
    </form>
    ${state.join ? '<button class="btn ghost" id="toreg">第一次來？填寫基本資料</button>' : ''}
    <p class="foot">連續輸入錯誤 5 次會鎖定 15 分鐘。忘記密碼或資料有誤，請聯絡沃克思的活動窗口。${state.join ? '' : '第一次合作的夥伴，請用活動負責人提供的報名連結填寫基本資料。'}</p>`;
  if (state.join) document.getElementById('toreg').addEventListener('click', () => viewRegister());
  const f = document.getElementById('f'), nid = document.getElementById('nid'), pw = document.getElementById('pw'), m = document.getElementById('m'), go = document.getElementById('go');
  nid.addEventListener('input', () => { nid.value = nid.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  document.getElementById('show').addEventListener('click', e => { const on = pw.type === 'password'; pw.type = on ? 'text' : 'password'; e.target.textContent = on ? '隱藏' : '顯示'; });
  f.addEventListener('submit', async e => {
    e.preventDefault(); go.disabled = true; go.textContent = '登入中…'; m.innerHTML = '';
    try {
      const r = await rpc('payroll_login', { p_national_id: nid.value, p_password: pw.value });
      if (r.ok) { saveToken(r.token); return state.ticket ? viewCheckin() : viewList(); }
      if (r.error === 'locked') m.innerHTML = '<div class="msg err">輸入錯誤次數過多，帳號已暫時鎖定。請 ' + esc(r.retry_after_minutes) + ' 分鐘後再試。</div>';
      else m.innerHTML = '<div class="msg err">身分證字號或密碼不正確。' + (r.attempts_left != null ? '還可以再試 ' + esc(r.attempts_left) + ' 次。' : '') + '</div>';
    } catch (err) { m.innerHTML = '<div class="msg err">' + esc(err.message) + '，請檢查網路後再試一次。</div>'; }
    go.disabled = false; go.textContent = '登入'; pw.value = ''; pw.focus();
  });
  nid.focus();
}

async function viewList() {
  document.title = '我的薪資｜沃克思';
  app.innerHTML = brand + '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  let r;
  try { r = await rpc('payroll_my_payslips', { p_token: state.token }); }
  catch (err) { app.innerHTML = brand + '<div class="msg err">' + esc(err.message) + '</div><button class="btn ghost" onclick="viewList()">重新載入</button>'; return; }
  if (!r.ok) { saveToken(null); return viewLogin('登入已逾時，請重新登入。'); }
  state.person = r.person; state.payslips = r.payslips;
  renderList();
}

function slipYear(s) { return (s.pay_date || s.period_end || s.period_start || '').slice(0, 4) || '未定'; }
function renderList() {
  const years = [...new Set(state.payslips.map(slipYear))].sort().reverse();
  if (state.year !== 'all' && !years.includes(state.year)) state.year = 'all';
  const shown = state.payslips.filter(s => state.year === 'all' || slipYear(s) === state.year);
  const total = shown.reduce((a, s) => a + Number(s.net || 0), 0);
  app.innerHTML = brand + `
    <div class="top">
      <div><h1>${esc(state.person.name)}</h1><p class="sub">${esc(state.person.national_id)}</p></div>
      <div class="no-print" style="display:flex;gap:8px">
        <button class="btn ghost small" id="me">我的資料</button>
        <button class="btn ghost small" id="out">登出</button>
      </div>
    </div>
    ${state.person.default_password ? '<div class="msg warn">你還在使用預設密碼（生日）。為了保護薪資資料，建議按右上角「我的資料」→「更改密碼」換一組。</div>' : ''}
    ${state.payslips.length ? `
      <div class="tabs" role="tablist">
        ${['all', ...years].map(y => `<button class="tab" role="tab" aria-selected="${state.year === y}" data-y="${esc(y)}">${y === 'all' ? '全部' : esc(y) + ' 年'}</button>`).join('')}
      </div>
      <p class="sub" style="margin-bottom:12px">共 ${shown.length} 筆，實發合計 NT$ ${money(total)}</p>
      ${shown.map(s => `
        <button class="card slip" data-id="${esc(s.id)}">
          <div class="row"><span class="name">${esc(s.event)}${s.relation === 'contract' ? '<span class="tag">勞務報酬</span>' : ''}</span><span class="amt">${money(s.net)}</span></div>
          <div class="meta">工作日 ${esc(fmtPeriod(s.period_start, s.period_end))}　發薪日 ${esc(fmtDate(s.pay_date))}</div>
        </button>`).join('')}`
      : '<div class="card empty">目前還沒有已發布的薪資單。<br>活動結束、公司核對完成後就會出現在這裡。</div>'}
    <p class="foot">薪資明細依勞動基準法第 23 條提供，可隨時查詢與列印。金額有疑問請聯絡沃克思的活動窗口。</p>`;
  app.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { state.year = b.dataset.y; renderList(); }));
  app.querySelectorAll('.slip').forEach(b => b.addEventListener('click', () => viewSlip(b.dataset.id)));
  document.getElementById('out').addEventListener('click', async () => { try { await rpc('payroll_logout', { p_token: state.token }); } catch (e) {} saveToken(null); viewLogin(); });
  document.getElementById('me').addEventListener('click', viewProfile);
}

async function viewSlip(id) {
  app.innerHTML = brand + '<div class="skeleton" style="height:150px"></div><div class="skeleton"></div>';
  let r;
  try { r = await rpc('payroll_payslip', { p_token: state.token, p_id: id }); }
  catch (err) { app.innerHTML = brand + '<div class="msg err">' + esc(err.message) + '</div><button class="btn ghost" onclick="renderList()">返回</button>'; return; }
  if (!r.ok) { if (r.error === 'session') { saveToken(null); return viewLogin('登入已逾時，請重新登入。'); } renderList(); return; }
  const p = r.payslip, contract = p.relation === 'contract';
  document.title = p.event + '｜薪資單';
  const by = k => p.items.filter(i => i.kind === k);
  const rows = list => list.map(i => `<tr><td>${esc(i.label)}${i.work_date ? '<div class="dim">' + esc(fmtDate(i.work_date, true)) + (i.hours != null ? '　' + esc(Number(i.hours)) + ' 小時 × ' + money(i.rate) : '') + '</div>' : ''}</td><td class="r">${money(i.amount)}</td></tr>`).join('');
  const hours = a => { if (!a.clock_in || !a.clock_out) return null; const [h1, m1] = a.clock_in.split(':').map(Number), [h2, m2] = a.clock_out.split(':').map(Number); return Math.round(((h2 * 60 + m2) - (h1 * 60 + m1) - (a.break_minutes || 0)) / 6) / 10; };
  const payable = Number(p.gross || 0) + Number(p.allowances || 0);
  app.innerHTML = brand + `
    <button class="link no-print" id="back">← 返回列表</button>
    <div class="card" style="margin-top:8px">
      <div class="hero">
        <div class="label">${contract ? '實領報酬' : '實發薪資'}</div>
        <div class="net"><small>NT$</small>${money(p.net)}</div>
        <p class="sub" style="margin-top:6px">${esc(p.event)}</p>
      </div>
      <div class="pad" style="border-top:1px solid var(--line)">
        <dl class="kv">
          <dt>${contract ? '給付單位' : '雇主'}</dt><dd>${esc(p.employer.legal_name || p.employer.name)}${p.employer.tax_id ? '（統編 ' + esc(p.employer.tax_id) + '）' : ''}</dd>
          <dt>姓名</dt><dd>${esc(p.person.name)}　${esc(p.person.national_id)}</dd>
          <dt>${contract ? '性質' : '崗位'}</dt><dd>${contract ? '勞務報酬（承攬）' : esc(p.role || '—')}</dd>
          <dt>計薪區間</dt><dd>${esc(fmtPeriod(p.period_start, p.period_end))}</dd>
          <dt>發薪日</dt><dd>${esc(fmtDate(p.pay_date))}</dd>
          <dt>匯款帳戶</dt><dd>${p.pay_account.last4 ? esc(p.pay_account.bank_code || '') + ' ' + esc(p.pay_account.branch || '') + '　末四碼 ' + esc(p.pay_account.last4) : '—'}</dd>
        </dl>
      </div>
    </div>
    ${p.basis !== 'hourly' ? '<div class="msg warn">這一場的原始紀錄只有每日工資總額，沒有逐時明細。若需要時數與加班的計算方式，請向沃克思索取。</div>' : ''}
    <h2>${contract ? '報酬項目' : '應發項目'}</h2>
    <div class="card pad" style="padding-top:6px;padding-bottom:6px"><table>
      ${rows(by('earning'))}${rows(by('allowance'))}
      <tr class="total"><td>${contract ? '報酬合計' : '應發合計'}</td><td class="r">${money(payable)}</td></tr>
    </table></div>
    <h2>應扣項目</h2>
    <div class="card pad" style="padding-top:6px;padding-bottom:6px"><table>
      ${by('deduction').length ? rows(by('deduction')) : '<tr><td class="dim">沒有扣款</td><td></td></tr>'}
      <tr class="total"><td>應扣合計</td><td class="r neg">${Number(p.deductions) ? '−' + money(p.deductions) : '0'}</td></tr>
    </table></div>
    ${by('employer').length ? '<h2>雇主負擔（不從薪資扣除）</h2><div class="card pad" style="padding-top:6px;padding-bottom:6px"><table>' + rows(by('employer')) + '</table></div>' : ''}
    ${p.attendance.length ? `<h2>出勤紀錄</h2>
    <div class="card pad" style="padding-top:6px;padding-bottom:6px"><table>
      <tr><th>日期</th><th>上班</th><th>下班</th><th class="r">休息</th><th class="r">工時</th></tr>
      ${p.attendance.map(a => `<tr><td>${esc(fmtDate(a.work_date, true).slice(5))}${a.source === 'legacy' && a.clock_in ? '<div class="dim">排定時段</div>' : ''}</td><td>${esc(a.clock_in || '—')}</td><td>${esc(a.clock_out || '—')}</td><td class="r">${a.clock_in ? esc(a.break_minutes) + ' 分' : '—'}</td><td class="r">${hours(a) != null ? hours(a) + ' 時' : '—'}</td></tr>`).join('')}
    </table></div>` : ''}
    ${p.note ? '<h2>備註</h2><div class="card pad">' + esc(p.note) + '</div>' : ''}
    <button class="btn no-print" id="print">列印／存成 PDF</button>
    <p class="foot">本明細依勞動基準法第 23 條及施行細則第 14 條之 1 提供，內容包含議定工資總額、各項目給付金額、得扣除項目金額及實際發給金額。出勤紀錄依同法第 30 條保存 5 年，如需書面副本可向沃克思申請。</p>`;
  document.getElementById('back').addEventListener('click', renderList);
  document.getElementById('print').addEventListener('click', () => window.print());
  window.scrollTo(0, 0);
}

function viewPassword() {
  document.title = '更改密碼｜沃克思';
  app.innerHTML = brand + `
    <button class="link" id="back">← 返回</button>
    <h1 style="margin-top:8px">更改密碼</h1>
    <form id="f" class="card pad" style="margin-top:18px">
      <label for="o" style="margin-top:0">目前的密碼</label><input id="o" type="password" autocomplete="current-password" required>
      <label for="n">新密碼（至少 8 個字）</label><input id="n" type="password" autocomplete="new-password" minlength="8" required>
      <label for="n2">再輸入一次新密碼</label><input id="n2" type="password" autocomplete="new-password" minlength="8" required>
      <div id="m"></div>
      <button class="btn" id="go">儲存新密碼</button>
    </form>`;
  const m = document.getElementById('m'), go = document.getElementById('go');
  document.getElementById('back').addEventListener('click', viewProfile);
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault(); m.innerHTML = '';
    const o = document.getElementById('o').value, n = document.getElementById('n').value, n2 = document.getElementById('n2').value;
    if (n !== n2) { m.innerHTML = '<div class="msg err">兩次輸入的新密碼不一樣。</div>'; return; }
    go.disabled = true;
    try {
      const r = await rpc('payroll_change_password', { p_token: state.token, p_old: o, p_new: n });
      if (r.ok) { if (state.person) state.person.default_password = false; viewProfile('密碼已更新。'); return; }
      if (r.error === 'session') { saveToken(null); return viewLogin('登入已逾時，請重新登入。'); }
      m.innerHTML = '<div class="msg err">' + (r.error === 'too_short' ? '新密碼至少要 8 個字。' : '目前的密碼不正確。') + '</div>';
    } catch (err) { m.innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; }
    go.disabled = false;
  });
}

const PERR = { bad_phone: '手機號碼請填 09 開頭的 10 碼。', bad_address: '請填完整的戶籍地址（含鄰里）。', bad_email: 'Email 格式不正確。', bad_bank_code: '銀行代碼是 3 個數字，例如 822。', bad_bank_account: '銀行帳號請只填數字（6 到 16 碼）。', payee_not_self: '戶名必須和本人姓名相同，薪資依法只能匯入本人帳戶。', bad_national_id: '身分證字號不正確，請再檢查一次。', bad_name: '請填寫姓名。', bad_birth: '請選擇正確的生日。', too_young: '未滿 15 歲依法不得受僱。', exists: '這個身分證字號已經有資料了，請直接登入。', no_consent: '請勾選同意聲明。', bad_join: '報名連結已失效，請向活動負責人索取新的連結。' };
const profileFields = (p, withName) => `
  <label for="ph">手機</label><input id="ph" type="tel" inputmode="numeric" maxlength="10" value="${esc(p.phone || '')}" placeholder="0912345678" required>
  <label for="em">Email（選填）</label><input id="em" type="email" value="${esc(p.email || '')}">
  <label for="ad">戶籍地址（需與身分證相同，含鄰里）</label><input id="ad" type="text" value="${esc(p.address || '')}" required>
  <h2>薪資匯款帳戶（須為本人帳戶）</h2>
  <label for="bc" style="margin-top:0">銀行代碼（3 碼）</label><input id="bc" type="text" inputmode="numeric" maxlength="3" value="${esc(p.bank_code || '')}" placeholder="例如 822" required>
  <label for="bb">分行名稱</label><input id="bb" type="text" value="${esc(p.bank_branch || '')}" placeholder="例如 中和分行">
  ${withName ? '' : '<label for="bn">戶名</label><input id="bn" type="text" value="' + esc(p.bank_account_name || p.name || '') + '" required>'}
  <label for="ba">銀行帳號</label><input id="ba" type="text" inputmode="numeric" maxlength="20" value="${esc(p.bank_account || '')}" required>`;
const readProfile = name => ({ phone: document.getElementById('ph').value, email: document.getElementById('em').value, address: document.getElementById('ad').value, bank_code: document.getElementById('bc').value, bank_branch: document.getElementById('bb').value, bank_account_name: name || document.getElementById('bn').value, bank_account: document.getElementById('ba').value });

async function viewRegister() {
  document.title = '填寫基本資料｜沃克思';
  app.innerHTML = brand + '<div class="skeleton" style="height:160px"></div>';
  let info;
  try { info = await rpc('payroll_join_info', { p_join: state.join }); } catch (err) { info = { ok: false }; }
  if (!info.ok) { saveJoin(null); return viewLogin(PERR.bad_join); }
  app.innerHTML = brand + `
    <p class="sub">${esc(info.event)}</p>
    <h1>填寫基本資料</h1>
    <p class="sub">只需要填一次，之後每場活動都不用重填。</p>
    <form id="f" class="card pad" style="margin-top:20px" autocomplete="on">
      <label for="nm" style="margin-top:0">姓名（與身分證相同）</label><input id="nm" type="text" autocomplete="name" required>
      <label for="nid">身分證字號</label><input id="nid" type="text" maxlength="10" autocapitalize="characters" spellcheck="false" required>
      <label for="bd">生日</label><input id="bd" type="date" required>
      ${profileFields({}, true)}
      <p class="hint">戶名會自動使用你的姓名。</p>
      <label class="check"><input id="ok" type="checkbox" required><span>我同意沃克思為了發放薪資、辦理勞工保險與就業保險加退保、所得稅扣繳申報，以及依勞動法令保存紀錄，蒐集、處理並使用以上資料與之後上傳的證件影本。資料依法保存 5 年，我可以隨時登入查閱與更正。</span></label>
      <div id="m"></div>
      <button class="btn" id="go">送出</button>
    </form>
    <button class="link" id="tologin" style="margin-top:10px">我已經有帳號，直接登入</button>`;
  const nid = document.getElementById('nid'), m = document.getElementById('m'), go = document.getElementById('go');
  nid.addEventListener('input', () => { nid.value = nid.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
  document.getElementById('tologin').addEventListener('click', () => viewLogin());
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault(); m.innerHTML = ''; go.disabled = true;
    const name = document.getElementById('nm').value.trim(), bd = document.getElementById('bd').value;
    try {
      const r = await rpc('payroll_register', { p_join: state.join, p_data: Object.assign(readProfile(name), { name, national_id: nid.value, birth_date: bd, consent: document.getElementById('ok').checked }) });
      if (r.ok) {
        saveToken(r.token); saveJoin(null);
        const [y, mo, d] = bd.split('-'); const pw = String(Number(y) - 1911).padStart(3, '0') + mo + d;
        return viewDocs('基本資料已建立。之後登入的帳號是身分證字號，密碼是你的民國生日 7 碼（' + pw + '）。');
      }
      m.innerHTML = '<div class="msg err">' + esc(PERR[r.error] || '送出失敗，請再試一次。') + '</div>';
    } catch (err) { m.innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; }
    go.disabled = false;
  });
}

const DOCS = [['id_front', '身分證正面'], ['id_back', '身分證反面'], ['bankbook', '存摺封面']];
async function fnCall(body) { const res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify(body) }); return res.json(); }
async function prepFile(file) {
  if (file.type === 'application/pdf') return file;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), 'image/jpeg', 0.85));
  } catch (e) { return file; }
}
async function uploadDoc(kind, file) {
  const blob = await prepFile(file), type = blob.type || file.type;
  const a = await fnCall({ action: 'upload_url', token: state.token, kind, content_type: type });
  if (!a.ok) throw new Error(a.error === 'session' ? '登入已逾時，請重新登入。' : a.error === 'bad_type' ? '請上傳照片或 PDF。' : '無法上傳，請稍後再試。');
  const put = await fetch(a.signed_url, { method: 'PUT', headers: { 'Content-Type': type }, body: blob });
  if (!put.ok) throw new Error(put.status === 413 ? '檔案太大（上限 8 MB）。' : '上傳失敗，請再試一次。');
  const c = await fnCall({ action: 'confirm', token: state.token, kind, path: a.path });
  if (!c.ok) throw new Error('上傳後確認失敗，請再試一次。');
}
function docsBlock(documents) {
  return '<div class="card pad" style="padding-top:4px;padding-bottom:4px">' + DOCS.map(([k, t]) => `<div class="doc"><div><div>${t}</div><div class="st ${documents[k] ? 'ok' : ''}" id="st-${k}">${documents[k] ? '已上傳（' + esc(String(documents[k]).slice(0, 10).replace(/-/g, '/')) + '）' : '尚未上傳'}</div></div><label class="filebtn">${documents[k] ? '重新上傳' : '選擇檔案'}<input type="file" accept="image/*,application/pdf" data-doc="${k}"></label></div>`).join('') + '</div>';
}
function bindDocs(after) {
  app.querySelectorAll('input[data-doc]').forEach(inp => inp.addEventListener('change', async () => {
    const f = inp.files[0], st = document.getElementById('st-' + inp.dataset.doc); if (!f) return;
    st.className = 'st'; st.textContent = '上傳中…';
    try { await uploadDoc(inp.dataset.doc, f); st.className = 'st ok'; st.textContent = '已上傳'; if (after) after(); }
    catch (err) { st.className = 'st'; st.style.color = 'var(--danger)'; st.textContent = err.message; }
    inp.value = '';
  }));
}
function viewDocs(message) {
  document.title = '上傳證件｜沃克思';
  app.innerHTML = brand + `<h1>上傳證件影本</h1>
    <p class="sub">加保勞保和匯款需要核對。照片只有你本人和沃克思的管理人員看得到。</p>
    ${message ? '<div class="msg ok">' + esc(message) + '</div>' : ''}
    <h2>請拍照或選擇檔案</h2>${docsBlock({})}
    <button class="btn" id="done">完成</button>
    <p class="foot">存摺請拍封面（有戶名與帳號的那一頁），不要拍提款卡或信用卡。現在沒帶在身邊也可以先按完成，之後到「我的資料」補傳。</p>`;
  bindDocs();
  document.getElementById('done').addEventListener('click', () => state.ticket ? viewCheckin() : viewList());
}
async function viewProfile(message) {
  document.title = '我的資料｜沃克思';
  app.innerHTML = brand + '<div class="skeleton" style="height:200px"></div>';
  let r;
  try { r = await rpc('payroll_profile', { p_token: state.token }); } catch (err) { app.innerHTML = brand + '<div class="msg err">' + esc(err.message) + '</div><button class="btn ghost" onclick="viewList()">返回</button>'; return; }
  if (!r.ok) { saveToken(null); return viewLogin('登入已逾時，請重新登入。'); }
  const p = r.profile;
  app.innerHTML = brand + `
    <button class="link" id="back">← 返回列表</button>
    <h1 style="margin-top:8px">我的資料</h1>
    <p class="sub">${esc(p.name)}　${esc(p.national_id)}　生日 ${esc(fmtDate(p.birth_date))}</p>
    ${typeof message === 'string' ? '<div class="msg ok">' + esc(message) + '</div>' : ''}
    <form id="f" class="card pad" style="margin-top:18px">
      <div style="margin-top:-16px"></div>${profileFields(p, false)}
      <div id="m"></div><button class="btn" id="go">儲存</button>
    </form>
    <h2>證件影本</h2>${docsBlock(p.documents || {})}
    <button class="btn ghost" id="cp">更改密碼</button>
    <p class="foot">姓名、身分證字號或生日有誤無法自行修改，請聯絡沃克思的活動窗口。更改匯款帳戶後請重新上傳存摺封面。</p>`;
  bindDocs();
  document.getElementById('back').addEventListener('click', viewList);
  document.getElementById('cp').addEventListener('click', viewPassword);
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault(); const m = document.getElementById('m'); m.innerHTML = '';
    try {
      const r2 = await rpc('payroll_update_profile', { p_token: state.token, p_data: readProfile() });
      m.innerHTML = r2.ok ? '<div class="msg ok">已儲存。</div>' : r2.error === 'session' ? '' : '<div class="msg err">' + esc(PERR[r2.error] || '儲存失敗。') + '</div>';
      if (r2.error === 'session') { saveToken(null); viewLogin('登入已逾時，請重新登入。'); }
    } catch (err) { m.innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; }
  });
}

async function viewCheckin(action) {
  document.title = '簽到退｜沃克思';
  if (!action) app.innerHTML = brand + '<div class="skeleton" style="height:220px"></div>';
  let r;
  try { r = await rpc('payroll_clock', { p_token: state.token, p_ticket: state.ticket, p_action: action || 'status' }); }
  catch (err) { app.innerHTML = brand + '<div class="msg err">' + esc(err.message) + '</div><button class="btn ghost" onclick="viewCheckin()">再試一次</button>'; return; }
  if (r.error === 'session') { saveToken(null); return viewLogin('請先登入，登入後就可以簽到。'); }
  if (r.error === 'ticket') { saveTicket(null); app.innerHTML = brand + '<h1>簽到連結已失效</h1><p class="sub" style="margin-top:8px">請重新掃描現場的 QR 碼。</p><button class="btn ghost" onclick="viewList()">查看我的薪資</button>'; return; }
  const note = { not_event_day: '今天不在這場活動的日期內，無法簽到。', already_in: '你已經簽到過了。', already_done: '今天已經完成簽到與簽退。', not_in: '找不到簽到紀錄，請先簽到。' }[r.error];
  const st = r.state || 'none';
  app.innerHTML = brand + `
    <p class="sub">${esc(r.event || '')}</p>
    <h1>${st === 'in' ? '上班中' : st === 'done' ? '今天已完成' : '尚未簽到'}</h1>
    <div class="card hero" style="margin-top:18px">
      <div class="label">現在時間</div>
      <div class="clock">${esc(r.now || '--:--')}</div>
      <dl class="kv" style="margin-top:16px;text-align:left">
        <dt>簽到</dt><dd>${esc(r.clock_in || '—')}</dd>
        <dt>簽退</dt><dd>${esc(r.clock_out || '—')}</dd>
      </dl>
    </div>
    ${r.ok && r.done ? '<div class="msg ok">' + (r.done === 'in' ? '簽到成功，時間 ' + esc(r.clock_in) + '。' : '簽退成功，時間 ' + esc(r.clock_out) + '。辛苦了。') + '</div>' : ''}
    ${note ? '<div class="msg warn">' + esc(note) + '</div>' : ''}
    ${r.error === 'not_event_day' || st === 'done' ? '' : st === 'in'
      ? '<button class="btn big out" id="act" data-a="out">簽退</button>'
      : '<button class="btn big" id="act" data-a="in">簽到</button>'}
    <button class="btn ghost" id="tolist">查看我的薪資</button>
    <p class="foot">簽到退時間以伺服器時間為準，記錄到分鐘，並依勞動基準法第 30 條保存 5 年。時間有誤請當場告訴現場負責人。</p>`;
  document.getElementById('tolist').addEventListener('click', viewList);
  const act = document.getElementById('act');
  if (act) act.addEventListener('click', () => {
    if (act.dataset.a === 'out' && !act.dataset.sure) { act.dataset.sure = '1'; act.textContent = '確定要簽退？再按一次'; return; }
    act.disabled = true; viewCheckin(act.dataset.a);
  });
}

(async function boot() {
  const qs = new URLSearchParams(location.search), code = qs.get('k'), join = qs.get('join');
  let codeMsg = null;
  if (join) { saveJoin(join); try { history.replaceState(null, '', location.pathname); } catch (e) {} }
  if (code) {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    try {
      const r = await rpc('payroll_checkin_ticket', { p_code: code });
      if (r.ok) saveTicket(r.ticket);
      else { saveTicket(null); codeMsg = r.error === 'expired' ? 'QR 碼已過期，請重新掃描現場的 QR 碼。' : 'QR 碼無法辨識，請重新掃描。'; }
    } catch (err) { codeMsg = '網路連線失敗，請重新掃描 QR 碼。'; }
  }
  if (!state.token && join) return viewRegister();
  if (!state.token) return viewLogin(codeMsg || (state.ticket ? '請先登入，登入後就可以簽到。' : null));
  if (state.ticket && code) return viewCheckin();
  viewList();
})();
</script>
