<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>薪資管理｜沃克思</title>
<style>
:root{--paper:#f5f2ec;--card:#fffdf9;--ink:#1d1c1a;--muted:#6f6b63;--line:#e3ded3;--soft:#efebe3;--accent:#1f5c4a;--accent-soft:#e4efe9;--warn:#8a5a00;--warn-soft:#fbf1d9;--danger:#a3271f;--danger-soft:#fbe6e3;--num:"SF Mono","Roboto Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
/* 外框：左側主選單＋內容 */
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--card);padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.logo{padding:0 12px 18px}.logo b{font-size:15px;letter-spacing:.2em;display:block}.logo span{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:9px;color:var(--muted);text-decoration:none;white-space:nowrap}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav.on{background:var(--soft);color:var(--ink);font-weight:600}
.nav .cnt{font-size:12px;min-width:20px;padding:0 6px;border-radius:99px;background:var(--warn-soft);color:var(--warn);text-align:center;font-weight:600}
.side .me{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.main{padding:26px 32px 90px;min-width:0;max-width:1240px}
@media (max-width:880px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:6;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);scrollbar-width:none}
  .side::-webkit-scrollbar{display:none}
  .logo,.side .me{display:none}
  .nav{padding:8px 12px}
  .main{padding:18px 16px 90px}
}
/* 基本元件 */
h1{font-size:23px;margin:0;line-height:1.3}
h2{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.12em;margin:26px 0 10px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:4px}.crumb a{text-decoration:none}.crumb a:hover{text-decoration:underline}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sub{color:var(--muted);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px 18px}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.grow{flex:1}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 5px}
.row label{margin-top:0}
input[type=text],input[type=password],input[type=date],input[type=datetime-local],input[type=search],select,textarea{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}
textarea{height:70px;padding:10px 12px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(29,28,26,.08)}
.btn{height:40px;padding:0 16px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:#cfc8b9}
.btn.block{display:block;width:100%;height:46px;margin-top:18px}
.btn.sm{height:34px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:13.5px}
.msg{margin:0 0 14px;padding:10px 12px;border-radius:8px;font-size:14px}
.msg.err{background:var(--danger-soft);color:var(--danger)}.msg.warn{background:var(--warn-soft);color:var(--warn)}.msg.ok{background:var(--accent-soft);color:var(--accent)}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.published,.badge.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.void{text-decoration:line-through}
.badge.error{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.dark{background:var(--ink);color:#fff;border-color:transparent}
.empty{padding:40px 18px;text-align:center;color:var(--muted)}
.skeleton{height:120px;border-radius:12px;background:linear-gradient(90deg,#ece8df,#f4f1ea,#ece8df);background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
/* 分頁（點選有深色底線，下方內容同步） */
.calbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.calbar select{width:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.cal .wd{padding:8px;font-size:12px;color:var(--muted);text-align:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--soft)}
.cal .day{min-height:108px;padding:6px;border:0;border-right:1px solid var(--line);border-bottom:3px solid transparent;box-shadow:inset 0 -1px 0 var(--line);background:var(--card);text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day:hover{background:var(--soft)}
.cal .day.out{background:var(--paper);color:var(--muted)}
.cal .day.sel{border-bottom-color:var(--ink);background:var(--soft)}
.cal .n{font-size:13px;font-weight:600;font-family:var(--num)}
.cal .day.today .n{background:var(--ink);color:#fff;border-radius:99px;padding:0 7px;align-self:flex-start}
.cal .chip{height:auto;font-size:12px;line-height:1.35;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid currentColor}
.cal .more{font-size:12px;color:var(--muted)}
@media (max-width:760px){.cal .day{min-height:64px;padding:4px}.cal .chip{font-size:0;padding:0;height:6px;border-left:0}.cal .more{font-size:10px}}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 0;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
/* 流程進度條 */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid var(--line);margin:4px 0 18px}
.step{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 12px 12px 0;text-align:left;cursor:pointer;min-width:0}
.step .n{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.step .n i{font-style:normal;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.step.done .n i{background:var(--accent);border-color:var(--accent);color:#fff}
.step b{display:block;font-size:15.5px;margin-top:2px}
.step .s{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step .s.attn{color:var(--warn)}
.step[aria-selected=true]{border-bottom-color:var(--ink)}
.step[aria-selected=false] b{color:var(--muted);font-weight:500}
@media (max-width:640px){.steps{display:flex;overflow-x:auto;scrollbar-width:none}.step{flex:0 0 118px}}
/* 表格 */
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.04em;background:rgba(29,28,26,.025)}
tr:last-child td{border-bottom:0}
tbody tr[data-k]{cursor:pointer}
tbody tr[data-k]:hover{background:rgba(29,28,26,.03)}
tbody tr.on{background:var(--accent-soft)}
.r{text-align:right;font-family:var(--num)}
.dim{color:var(--muted);font-size:12.5px}
/* 左右分割 */
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,1fr);gap:16px;align-items:start}
.detail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding:16px 18px}
.detail .x{float:right}
@media (max-width:1080px){.split{grid-template-columns:1fr}.detail{position:static;max-height:none}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px;margin:0}.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;word-break:break-all}
.detail table td{padding:8px 0;white-space:normal}
.issue{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.issue:last-child{border-bottom:0}.issue.done{opacity:.5}
/* 統計 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{padding:12px 14px}.stat .k{font-size:12px;color:var(--muted)}.stat .v{font-family:var(--num);font-size:22px;font-weight:600;margin-top:2px}
/* 批次操作列 */
.bulk{position:sticky;bottom:14px;margin-top:12px;padding:10px 12px 10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ink);color:#fff;border-radius:12px;z-index:3}
.bulk .btn{background:#fff;color:var(--ink);height:34px}.bulk .btn.ghost{background:none;color:#fff;border-color:rgba(255,255,255,.4)}
/* 今日現場 */
.live{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:880px){.live{grid-template-columns:1fr}}
.qrbox{background:#fff;padding:14px;border-radius:12px;border:1px solid var(--line)}
.qrbox svg{display:block;width:100%;height:auto}
.qrscreen{position:fixed;inset:0;background:var(--paper);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.qrscreen .qrbox svg{width:min(72vw,62vh,440px)}
.docgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:8px}
.doccell .dim{margin-bottom:4px}
.docthumb{min-height:84px;border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center}
.docthumb img{max-width:100%;max-height:160px;border-radius:4px;display:block}
.docthumb.empty-doc{background:var(--paper)}
button.stat{font:inherit;color:inherit;text-align:left;cursor:pointer;border-bottom:3px solid var(--line)}
button.stat:hover{background:var(--soft)}
button.stat.sel{border-bottom-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.authwrap{max-width:420px;margin:60px auto;padding:0 16px}
/* 表格篩選排序（仿 Excel 自動篩選） */
th .xf{border:0;background:none;padding:0 2px;margin-left:4px;cursor:pointer;color:var(--muted);font-size:11px;line-height:1;border-radius:4px;vertical-align:1px}
th .xf:hover{background:var(--soft);color:var(--ink)}
th .xf.on{color:var(--accent);font-weight:700}
.xpop{position:fixed;z-index:50;width:250px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(29,28,26,.14);padding:8px;font-size:13.5px}
.xpop button.it{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;cursor:pointer}
.xpop button.it:hover{background:var(--soft)}
.xpop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.xpop input[type=search]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-bottom:6px}
.xpop .vals{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.xpop .vals label{display:flex;gap:6px;align-items:center;padding:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.xpop .acts{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.xpop .acts button{padding:5px 12px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer}
.xpop .acts button.ok{background:var(--ink);color:#fff;border-color:var(--ink)}
.xnote{font-size:12.5px;color:var(--muted);padding:6px 12px}
</style>
</head>
<body>
<div id="root"></div>
<div id="overlay"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" integrity="sha384-mZT2gIty7ZDdOGkxfP6joZcYdMW1Jvj9dRlfpTmaJAKKXTqzygtB22k7FLe+KZC1" crossorigin="anonymous"></script>
<script>
const API = 'https://rxekuiadnzjfvjcgmrxr.supabase.co/rest/v1/rpc/';
const FN = 'https://rxekuiadnzjfvjcgmrxr.supabase.co/functions/v1/docs';
const LINE_FN = 'https://rxekuiadnzjfvjcgmrxr.supabase.co/functions/v1/line';
async function lineCall(action) { const res = await fetch(LINE_FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify({ action, admin_token: S.token }) }); return res.json(); }
const KEY = 'sb_publishable_ZQtUdhkpsPV_XhIkI1K05A_mDaLNsQQ';
const root = document.getElementById('root'), overlay = document.getElementById('overlay');
const S = { token: null, user: null, ov: null, flash: null, cache: {}, sel: new Set(), filter: {}, detail: null, confirm: null, timers: [] };
try { S.token = sessionStorage.getItem('payroll_admin_token'); } catch (e) {}
function saveToken(t) { S.token = t; try { t ? sessionStorage.setItem('payroll_admin_token', t) : sessionStorage.removeItem('payroll_admin_token'); } catch (e) {} }

const NO_TOKEN = ['admin_setup', 'admin_login'];
// 和資料庫一樣以字元（而非 UTF-16 碼元）計算長度
const pwShort = s => Array.from(s || '').length < 8;
async function rpc(name, body) {
  const res = await fetch(API + name, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(NO_TOKEN.includes(name) ? (body || {}) : Object.assign({ p_token: S.token }, body || {})) });
  if (!res.ok) throw new Error('連線失敗（' + res.status + '）');
  const j = await res.json();
  if (j && j.ok === false && j.error === 'session') { saveToken(null); viewAuth('login', '登入已逾時，請重新登入。'); throw new Error('session'); }
  return j;
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => n == null ? '—' : Number(n).toLocaleString('zh-TW');
const tpe = s => { s = String(s); return s.length > 10 && s.includes('T') ? new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei' }).format(new Date(s)) : s.slice(0, 10); };
const d = s => s ? tpe(s).replace(/-/g, '/') : '—';
const md = s => s ? String(s).slice(5, 10).replace('-', '/') : '—';
const hm = t => t ? String(t).slice(11, 16) : '—';
const dur = m => m == null ? '—' : Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
const today = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei' }).format(new Date());
const STATUS = { draft: '草稿', published: '已發布', void: '作廢' };
const SRC = { qr: 'QR 打卡', manual: '人工', legacy: '舊資料' };
const openIssues = list => (list || []).filter(i => !i.resolved && i.severity !== 'info');
const $ = id => document.getElementById(id);
function on(sel, ev, fn) { root.querySelectorAll(sel).forEach(el => el.addEventListener(ev, e => fn(e, el))); }
function clearTimers() { S.timers.forEach(t => clearTimeout(t)); S.timers = []; }
function flash(type, text) { S.flash = { type, text }; }
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }

/* ---------- 登入 ---------- */
function viewAuth(mode, message) {
  clearTimers(); overlay.innerHTML = '';
  const setup = mode === 'setup';
  root.innerHTML = `<div class="authwrap">
    <div class="logo" style="padding:0 0 26px"><b>WORKS</b><span>沃克思 薪資管理</span></div>
    <h1>${setup ? '首次設定管理員' : '管理員登入'}</h1>
    <form id="f" class="card pad" style="margin-top:18px">
      ${setup ? '<label for="code" style="margin-top:0">設定碼</label><input id="code" type="text" autocomplete="off" required>' : ''}
      <label for="u" ${setup ? '' : 'style="margin-top:0"'}>帳號</label><input id="u" type="text" autocomplete="username" autocapitalize="none" required>
      <label for="p">密碼${setup ? '（至少 8 個字）' : ''}</label><input id="p" type="password" autocomplete="${setup ? 'new-password' : 'current-password'}" required>
      <div id="m" style="margin-top:12px">${message ? '<div class="msg warn">' + esc(message) + '</div>' : ''}</div>
      <button class="btn block">${setup ? '建立管理員' : '登入'}</button>
    </form>
    <button class="link" id="sw" style="margin-top:10px">${setup ? '已經有帳號，回到登入' : '第一次使用？用設定碼建立管理員'}</button></div>`;
  $('sw').onclick = () => viewAuth(setup ? 'login' : 'setup');
  $('f').onsubmit = async e => {
    e.preventDefault(); const m = $('m'); m.innerHTML = '';
    const u = $('u').value, p = $('p').value;
    if (setup && pwShort(p)) { m.innerHTML = '<div class="msg err">密碼至少要 8 個字。</div>'; return; }
    try {
      if (setup) {
        const r = await rpc('admin_setup', { p_code: $('code').value, p_username: u, p_password: p });
        if (!r.ok) { m.innerHTML = '<div class="msg err">' + ({ bad_code: '設定碼不正確、已用過或已過期。', bad_username: '帳號請用 3 個字以上的英數字或 Email。', too_short: '密碼至少要 8 個字。', taken: '這個帳號已經存在。' }[r.error] || '建立失敗') + '</div>'; return; }
      }
      const r = await rpc('admin_login', { p_username: u, p_password: p });
      if (r.ok) { saveToken(r.token); S.user = r.username; S.ov = null; return route(); }
      m.innerHTML = '<div class="msg err">' + (r.error === 'locked' ? '錯誤次數過多，請 ' + esc(r.retry_after_minutes) + ' 分鐘後再試。' : '帳號或密碼不正確。連續錯 5 次會鎖定 15 分鐘。') + '</div>';
    } catch (err) { if (err.message !== 'session') m.innerHTML = '<div class="msg err">' + esc(err.message) + '</div>'; }
  };
}

/* ---------- 外框與路由 ---------- */
const NAV = [['today', '今日現場'], ['events', '活動'], ['calendar', '班表'], ['people', '人員'], ['roster', '加保名冊'], ['payouts', '薪資發放'], ['settings', '設定']];
function activeEvents() { const t = today(); return (S.ov ? S.ov.events : []).filter(e => e.start_date && e.start_date <= t && (e.end_date || e.start_date) >= addDays(t, -1)); }
function addDays(s, n) { const x = new Date(s + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); }
function shell(section, html) {
  const badges = { today: activeEvents().length, events: (S.ov ? S.ov.events : []).reduce((a, e) => a + Number(e.open_issues || 0), 0) };
  root.innerHTML = `<div class="shell">
    <nav class="side" aria-label="主選單">
      <div class="logo"><b>WORKS</b><span>沃克思 薪資管理</span></div>
      ${NAV.map(([k, t]) => `<a class="nav ${section === k ? 'on' : ''}" href="#/${k}" ${section === k ? 'aria-current="page"' : ''}><span>${t}</span>${badges[k] ? '<span class="cnt">' + badges[k] + '</span>' : ''}</a>`).join('')}
      <div class="me"><span>${esc(S.user || '')}</span><button class="link" id="logout">登出</button></div>
    </nav>
    <main class="main" id="main">${S.flash ? '<div class="msg ' + S.flash.type + '">' + esc(S.flash.text) + '</div>' : ''}${html}</main></div>`;
  S.flash = null;
  $('logout').onclick = async () => { try { await rpc('admin_logout'); } catch (e) {} saveToken(null); S.ov = null; viewAuth('login'); };
}

async function loadEventData(id) {
  const [ev, att, st, rc] = await Promise.all([rpc('admin_event', { p_event: id }), rpc('admin_attendance', { p_event: id }), rpc('admin_event_staff', { p_event: id }), rpc('admin_recruit', { p_event: id })]);

function stepInfo(e) {
  const c = S.cache, t = today();
  const live = c.slips.filter(s => s.status !== 'void');
  const issues = openIssues(c.eventIssues).length + live.reduce((a, s) => a + openIssues(s.issues).length, 0);
  const openAtt = c.att.filter(r => r.clock_in && !r.clock_out).length;
  const pub = live.filter(s => s.status === 'published').length;
  return {
    staff: (() => {
      const sh = c.rc.shifts, need = sh.reduce((a, x) => a + x.headcount, 0), acc = sh.reduce((a, x) => a + Number(x.accepted), 0), pend = sh.reduce((a, x) => a + Number(x.applied), 0);
      if (!sh.length) return { done: c.staff.length > 0, s: c.staff.length ? c.staff.length + ' 人' : '尚未開班次', attn: !c.staff.length };
      return { done: acc >= need, s: '錄取 ' + acc + ' / ' + need + (pend ? '，' + pend + ' 待審' : ''), attn: pend > 0 || acc < need };
    })(),
    att: { done: c.att.length > 0 && !openAtt, s: openAtt ? openAtt + ' 筆未簽退' : c.att.length + ' 筆紀錄', attn: openAtt > 0 },
    review: { done: live.length > 0 && !issues, s: issues ? '剩 ' + issues + ' 件' : live.length ? '完成' : '尚無薪資單', attn: issues > 0 },
    publish: { done: live.length > 0 && pub === live.length, s: pub + ' / ' + live.length, attn: live.length > 0 && pub < live.length },
    payout: { done: !!payDateOf(e) && payDateOf(e) <= t && live.length > 0 && pub === live.length, s: payDateOf(e) ? '發薪日 ' + md(payDateOf(e)) : '發薪日未設', attn: !payDateOf(e) }
  };
}

// 提早到、遲到、超時的標記：提早與超時預設不計薪，主管核准後才計
function attBadge(r, side) {
  if (side === 'in' && r.in_notice === 'early') return ` <span class="badge ${r.early_approved ? 'ok' : ''}">早 ${esc(r.in_notice_minutes)} 分${r.early_approved ? '・已核准' : '・未計'}</span>`;
  if (side === 'in' && r.in_notice === 'late') return ` <span class="badge warn">遲到 ${esc(r.in_notice_minutes)} 分</span>`;
  if (side === 'out' && r.out_notice === 'overtime') return ` <span class="badge ${r.ot_approved ? 'ok' : 'warn'}">超時 ${esc(r.out_notice_minutes)} 分${r.ot_approved ? '・已核准' : '・待核准'}</span>`;
  return '';
}

const SHORT = { net_mismatch: '金額不符', missing_pay: '沒有金額', items_mismatch: '明細不符', payee_not_self: '戶名非本人', no_bank_account: '無帳戶', no_ins_deduction: '未扣勞保', ins_days_gt_worked: '勞保天數', relation_unconfirmed: '僱傭或承攬', invalid_national_id: '身分證有誤', birth_unparsed: '生日不明', consecutive_days: '連續出勤', below_min_wage: '低於最低工資', over_12h: '超過12小時', no_break: '休息不足', rest_day: '休息日', regular_leave_work: '例假出勤', week_over_40: '週超40時', nhi_supplement: '補充保費', no_pay_date: '無發薪日', new_registration: '新登錄', minor: '未成年', bank_changed: '改帳戶', contract_with_ins: '承攬有勞保' };

/* 步驟四：發布 */

    const rows = live.filter(s => f === 'all' || s.status === f);
    const sel = [...S.sel];
    return splitWrap(`<div class="chips">${[['all', '全部', live.length], ['draft', '草稿', live.filter(s => s.status === 'draft').length], ['published', '已發布', live.filter(s => s.status === 'published').length]].map(([k, t, n]) => `<button class="chip" aria-pressed="${f === k}" data-f="${k}">${t} ${n}</button>`).join('')}</div>
      <div class="card tablebox"><table>
      <thead><tr><th><input type="checkbox" id="all" aria-label="全選" ${rows.length && rows.every(s => S.sel.has(s.id)) ? 'checked' : ''}></th><th>姓名</th><th class="r">應發</th><th class="r">扣款</th><th class="r">實發</th><th>狀態</th></tr></thead>
      <tbody>${rows.map(s => `<tr data-k="${esc(s.id)}" class="${S.detail && S.detail.key === s.id ? 'on' : ''}"><td><input type="checkbox" class="ck" data-id="${esc(s.id)}" aria-label="選取 ${esc(s.name)}" ${S.sel.has(s.id) ? 'checked' : ''}></td>
        <td>${esc(s.name)}${openIssues(s.issues).length ? ' <span class="badge warn">' + openIssues(s.issues).length + '</span>' : ''}<div class="dim">${esc(s.role || '')}${s.relation === 'contract' ? '・承攬' : ''}</div></td>
        <td class="r">${money(s.gross)}</td><td class="r">${Number(s.deductions) ? money(s.deductions) : ''}</td><td class="r"><b>${money(s.net)}</b></td>
        <td><span class="badge ${esc(s.status)}">${STATUS[s.status]}</span></td></tr>`).join('') || '<tr><td colspan="6" class="empty">沒有薪資單。到「出勤」按「依出勤產生薪資單」。</td></tr>'}</tbody>
      </table></div>
      ${sel.length ? `<div class="bulk">${S.confirm ? `<span class="grow">${S.confirm === 'published' ? '確定發布 ' + sel.length + ' 筆？發布後工讀生登入就看得到。' : '確定把 ' + sel.length + ' 筆改回草稿？'}</span><button class="btn" id="yes">確定</button><button class="btn ghost" id="no">取消</button>`
        : `<span class="grow">已選 ${sel.length} 筆</span><button class="btn" id="pub">發布</button><button class="btn ghost" id="unpub">改回草稿</button><button class="btn ghost" id="clr">取消選取</button>`}</div>` : ''}`);
  },
  bind: e => {
    on('tbody tr[data-k]', 'click', (ev, tr) => { if (ev.target.closest('input')) return; openDetail('slip', tr.dataset.k, e); });
    on('.chip', 'click', (ev, b) => { S.filter.pub = b.dataset.f; viewEvent(e.id, 'publish'); });
    on('.ck', 'change', (ev, c) => { c.checked ? S.sel.add(c.dataset.id) : S.sel.delete(c.dataset.id); S.confirm = null; viewEvent(e.id, 'publish'); });
    const all = $('all'); if (all) all.onchange = () => { const f = S.filter.pub || 'all'; S.cache.slips.filter(s => s.status !== 'void' && (f === 'all' || s.status === f)).forEach(s => all.checked ? S.sel.add(s.id) : S.sel.delete(s.id)); S.confirm = null; viewEvent(e.id, 'publish'); };
    const b = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
    b('pub', () => { S.confirm = 'published'; viewEvent(e.id, 'publish'); });
    b('unpub', () => { S.confirm = 'draft'; viewEvent(e.id, 'publish'); });
    b('clr', () => { S.sel = new Set(); viewEvent(e.id, 'publish'); });
    b('no', () => { S.confirm = null; viewEvent(e.id, 'publish'); });
    b('yes', async () => {
      const status = S.confirm; S.confirm = null;
      const r = await rpc('admin_set_status', { p_ids: [...S.sel], p_status: status });

/* 步驟五：匯款 */
const stepPayout = {
  html: e => {
    const live = S.cache.slips.filter(s => s.status !== 'void' && s.relation !== 'contract');
    const pub = live.filter(s => s.status === 'published');
    const noAcct = pub.filter(s => !s.pay_account).length;
    return `<div class="card pad" style="margin-bottom:14px"><div class="row">
        ${payModeHtml('pp', e)}
        <button class="btn ghost" id="pdsave">儲存並套用到全部薪資單</button><span class="grow"></span>
        <button class="btn" id="csv" ${pub.length ? '' : 'disabled'}>下載匯款清單（CSV）</button></div>
        <p class="sub" style="margin-top:10px">${e.pay_date ? '目前發薪日：' + esc(d(e.pay_date)) + '。' : e.pay_within_days != null ? '目前為活動結束後 ' + esc(e.pay_within_days) + ' 天內發薪，薪資單發薪日為 ' + esc(d(addDays(e.end_date || e.start_date, Number(e.pay_within_days)))) + '。' : '<span style="color:var(--warn)">尚未設定發薪日。</span>'}薪資單上必須顯示發薪日。匯款清單只含已發布、屬於僱傭的薪資單，可直接在 Excel 開啟後交給銀行或會計。</p></div>
      <div class="stats"><div class="card stat"><div class="k">已發布</div><div class="v">${pub.length} / ${live.length}</div></div>
        <div class="card stat"><div class="k">匯款總額</div><div class="v">${money(pub.reduce((a, s) => a + Number(s.net || 0), 0))}</div></div>
        <div class="card stat"><div class="k">缺匯款帳戶</div><div class="v" style="${noAcct ? 'color:var(--warn)' : ''}">${noAcct}</div></div></div>
      <div class="card tablebox"><table>
      <thead><tr><th>姓名</th><th>銀行</th><th>戶名</th><th>帳號</th><th class="r">實發</th><th>狀態</th></tr></thead>
      <tbody>${live.map(s => `<tr><td>${esc(s.name)}</td><td>${esc([s.pay_bank_code, s.pay_bank_branch].filter(Boolean).join(' ') || '—')}</td><td>${esc(s.pay_account_name || '—')}</td>
        <td>${s.pay_account ? esc(s.pay_account) : '<span class="badge warn">缺</span>'}${openIssues(s.issues).some(i => i.code === 'bank_changed') ? ' <span class="badge warn">帳戶待核</span>' : ''}</td><td class="r">${money(s.net)}</td><td><span class="badge ${esc(s.status)}">${STATUS[s.status]}</span></td></tr>`).join('') || '<tr><td colspan="6" class="empty">沒有薪資單</td></tr>'}</tbody>
      </table></div>`;
  },
  bind: e => {
    bindPayMode('pp');
    $('pdsave').onclick = async () => {
      const pm = readPayMode('pp');
      if ($('ppmode').value === 'date' && !pm.pay_date) { flash('err', '請選擇發薪日。'); return refreshEvent(e, 'payout'); }
      if ($('ppmode').value === 'days' && pm.pay_within_days === '') { flash('err', '請填活動結束後幾天內發薪。'); return refreshEvent(e, 'payout'); }
      const r = await rpc('admin_update_event', { p_id: e.id, p_patch: Object.assign({ apply_to_payslips: true }, pm) });
      flash(r.ok ? 'ok' : 'err', r.ok ? '發薪日 ' + d(r.pay_date) + ' 已套用到 ' + r.payslips_updated + ' 張薪資單。' : (PAY_ERR[r.error] || '儲存失敗。')); refreshEvent(e, 'payout');
    };
    const c = $('csv'); if (c) c.onclick = async () => {
      // 下載當下向伺服器取最新的帳戶與核對狀態，不用畫面上的舊資料
      const r = await rpc('admin_payout', { p_event: e.id });
      if (!r.ok) { alert('無法取得匯款資料。'); return; }
      const HOLD = { no_pay_date: '沒有發薪日', bad_account: '帳號格式不正確', bank_pending: '帳戶剛被本人更改、尚未核對', payee_mismatch: '戶名與本人姓名不同' };
      const pub = r.rows.filter(x => !x.hold), held = r.rows.filter(x => x.hold);
      if (held.length) alert(held.length + ' 筆沒有放進匯款清單：\n' + held.map(x => x.name + '：' + HOLD[x.hold]).join('\n') + '\n\n請處理後再下載。');
      if (!pub.length) return;
      const q = t => '"' + String(t).replace(/"/g, '""') + '"';
      const cell = v => { let t = String(v == null ? '' : v); if (/^[\s]*[=+\-@]/.test(t)) t = "'" + t; return q(t); };
      const digits = v => q('="' + String(v) + '"');
      const lines = [['姓名', '身分證字號', '銀行代碼', '分行', '戶名', '帳號', '實發金額', '發薪日'].map(cell).join(',')]
        .concat(pub.map(s => [cell(s.name), cell(s.national_id), digits(s.bank_code), cell(s.bank_branch), cell(s.account_name), digits(s.account), Number(s.net) || 0, cell(s.pay_date)].join(',')));
      const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = e.name.replace(/[\\/:*?"<>|]/g, '') + '-匯款清單.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
  }
};

  if (kind === 'app') {
    const rc = S.cache.rc, a = rc.applicants.find(x => x.app_id === key); if (!a) return;

    box.innerHTML = `${close}<h1 style="font-size:19px">${esc(a.name)}</h1><p class="sub" style="margin-top:4px">${esc(a.national_id)}　${esc(a.phone || '')}　${a.past_events ? '合作過 ' + a.past_events + ' 場' : '第一次合作'}</p>
      <div class="row" style="margin-top:10px">${a.has_photo ? '<button class="btn ghost sm" id="photo">看照片</button>' : ''}<button class="btn ghost sm" id="toperson">人員資料（證件 ${a.docs}/3）</button></div>

        <div class="row" style="gap:6px">${['accepted', 'waitlist', 'rejected'].map(st => `<button class="btn ${a.shifts[x.id] === st ? '' : 'ghost'} sm" data-one="${esc(x.id)}" data-st="${st}">${AST[st][0]}</button>`).join('')}</div></div>`).join('')}
      <button class="btn block" id="accall">錄取全部報名的班次</button>

      ${Object.values(a.shifts).includes('accepted') ? '<button class="link" id="ctext">查看契約內容</button><div id="ctbox"></div>' : ''}`;
    bindClose();
    $('toperson').onclick = () => go('#/people/' + a.person_id);
    if ($('photo')) $('photo').onclick = () => viewDoc(a.person_id, 'photo');
    const decide = async (items, st) => {
      const r = await rpc('admin_decide', { p_items: items, p_status: st });
      const parts = []; if ((r.full || []).length) parts.push('名額已滿：' + r.full.join('、')); if ((r.clash || []).length) parts.push('與已錄取的班次時間重疊：' + r.clash.join('、'));
      flash(parts.length ? 'warn' : 'ok', parts.length ? a.name + ' 部分未錄取。' + parts.join('；') + '。' : a.name + ' 已更新。'); S.detail = { kind: 'app', key }; refreshEvent(e, 'staff'); };

          const r3 = await rpc('admin_set_attendance', { p_id: a.id, p_patch: { clock_in: v('in'), clock_out: v('out'), break_minutes: v('br'), note: $('areason').value || a.note || '核對時調整' } });
          if (!r3.ok) {

            return msg(why);
          }
          changed++;
        }
        const r4 = await rpc('admin_recompute_payslip', { p_event: e.id, p_person: p.person.id });
        if (!r4.ok) return msg(r4.reason || '重算失敗，請再試一次。');
        flash('ok', (changed ? '已更新 ' + changed + ' 天出勤，' : '') + '薪資已重算：應發 ' + money(r4.gross) + '，實發 ' + money(r4.net) + '。');
        S.detail = { kind: 'slip', key: r4.id }; refreshEvent(e, 'review');
      } catch (err) { if (err.message !== 'session') msg(err.message); }

    $('save').onclick = async () => {
      const r2 = await rpc('admin_update_payslip', { p_id: key, p_patch: { relation: $('rel').value, pay_date: $('pdate').value, note: $('note').value } });

}

async function viewToday(pick) {
  const evs = activeEvents();
  if (!evs.length) {
    shell('today', `<div class="head"><div><h1>今日現場</h1><p class="sub">${esc(d(today()))}</p></div></div>
      <div class="card empty">今天沒有進行中的活動。<br><a href="#/events">到活動清單建立或查看活動</a></div>`);
    return;
  }
  const e = evs.find(x => x.id === pick) || evs[0];
  const [att, st] = await Promise.all([rpc('admin_attendance', { p_event: e.id }), rpc('admin_event_staff', { p_event: e.id })]);
  const t = today(), rows = att.rows.filter(r => r.work_date === t || (r.clock_in && !r.clock_out));
  const working = rows.filter(r => r.clock_in && !r.clock_out), done = rows.filter(r => r.clock_out);
  const seen = new Set(rows.map(r => r.person_id));
  const notYet = st.has_shifts ? st.staff.filter(p => p.today_shift && !seen.has(p.person_id)) : st.staff.filter(p => !seen.has(p.person_id) && (!p.staff || p.staff.relation !== 'contract'));
  const shiftOf = {}; st.staff.forEach(p => { shiftOf[p.person_id] = p.today_shift; });
  const list = (title, items, fn) => `<h2>${title}（${items.length}）</h2><div class="card">${items.length ? '<table>' + items.map(fn).join('') + '</table>' : '<p class="empty" style="padding:18px">—</p>'}</div>`;
  shell('today', `
    <div class="head"><div><h1>今日現場</h1><p class="sub">${esc(d(t))}　每 30 秒自動更新</p></div><a class="btn ghost" style="display:inline-flex;align-items:center;text-decoration:none" href="#/events/${esc(e.id)}/att">到出勤明細</a></div>
    ${evs.length > 1 ? '<div class="tabs" role="tablist">' + evs.map(x => `<button class="tab" role="tab" aria-selected="${x.id === e.id}" data-id="${esc(x.id)}">${esc(x.name)}</button>`).join('') + '</div>' : '<p style="margin:-6px 0 16px;font-weight:600">' + esc(e.name) + '</p>'}
    <div class="live">
      <div class="card pad" style="text-align:center"><p class="sub">掃描簽到／簽退</p><div class="qrbox" id="qr" style="margin-top:10px"><p class="sub">產生中…</p></div>
        <p class="sub" style="margin-top:10px">每分鐘自動更換</p><button class="btn block" id="full" style="margin-top:12px">全螢幕顯示</button></div>
      <div>
        <div class="stats"><div class="card stat"><div class="k">上班中</div><div class="v">${working.length}</div></div><div class="card stat"><div class="k">已簽退</div><div class="v">${done.length}</div></div><div class="card stat"><div class="k">尚未簽到</div><div class="v" style="${notYet.length ? 'color:var(--warn)' : ''}">${notYet.length}</div></div></div>
        ${list('上班中', working, r => `<tr><td>${esc(r.name)}${st.has_shifts && !shiftOf[r.person_id] ? ' <span class="badge warn">今天沒排班</span>' : ''}</td><td class="r">${esc(hm(r.clock_in))} 簽到${r.work_date !== t ? ' <span class="badge warn">' + esc(md(r.work_date)) + ' 未簽退</span>' : ''}</td></tr>`)}
        ${list('尚未簽到', notYet, p => `<tr><td>${esc(p.name)}${p.today_shift ? '<div class="dim">班次 ' + esc(p.today_shift) + '</div>' : ''}</td><td class="r"><span class="dim">${esc(p.phone || '')}</span></td></tr>`)}
        ${list('已簽退', done, r => `<tr><td>${esc(r.name)}</td><td class="r">${esc(hm(r.clock_in))}–${esc(hm(r.clock_out))}　${esc(dur(r.minutes))}</td></tr>`)}
        <p class="sub" style="margin-top:10px">${st.has_shifts ? '「尚未簽到」是今天有排班、但還沒打卡的人。' : '這場活動沒有開班次，「尚未簽到」列出所有活動人員。'}忘記打卡請到出勤明細補登。</p>
      </div></div>`);
  on('.tab', 'click', (ev, b) => go('#/today/' + b.dataset.id));
  $('full').onclick = () => showQr(e);
  const tick = async () => {
    const box = $('qr'); if (!box) return;
    try {
      const r = await rpc('admin_checkin_code', { p_event: e.id });
      const url = new URL('./', location.href).href + '?k=' + r.code;
      const q = qrcode(0, 'M'); q.addData(url); q.make();
      box.innerHTML = q.createSvgTag({ cellSize: 5, margin: 2, scalable: true });
      S.timers.push(setTimeout(tick, (Number(r.refresh_in) + 1) * 1000));
    } catch (err) { if (err.message !== 'session') S.timers.push(setTimeout(tick, 5000)); }
  };
  tick();
  S.timers.push(setTimeout(() => { if (location.hash.startsWith('#/today') && !overlay.innerHTML) route(); }, 30000));
}
function showQr(e) {
  let timer = null;
  overlay.innerHTML = `<div class="qrscreen"><p class="sub">掃描簽到／簽退</p><h1 style="margin:4px 0 18px">${esc(e.name)}</h1>
    <div class="qrbox" id="bigqr"><p class="sub">產生中…</p></div><p class="sub" style="margin-top:14px">每分鐘自動更換，請工讀生用手機相機掃描後登入。</p>
    <button class="btn ghost" id="qrclose" style="margin-top:18px">關閉</button></div>`;
  const stop = () => { clearTimeout(timer); overlay.innerHTML = ''; };
  $('qrclose').onclick = stop;
  const tick = async () => {
    if (!$('bigqr')) return;
    try {
      const r = await rpc('admin_checkin_code', { p_event: e.id });
      const url = new URL('./', location.href).href + '?k=' + r.code;
      const q = qrcode(0, 'M'); q.addData(url); q.make();
      $('bigqr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
      timer = setTimeout(tick, (Number(r.refresh_in) + 1) * 1000);
    } catch (err) { if (err.message === 'session') return stop(); timer = setTimeout(tick, 5000); }
  };
  tick();
}


/* ---------- 班表行事曆 ---------- */
const CAL_COLORS = [['#1f5c4a', '#e4efe9'], ['#2b4f8a', '#e3eaf6'], ['#8a5a00', '#fbf1d9'], ['#7a2f6b', '#f4e5f0'], ['#a3271f', '#fbe6e3'], ['#3d5a1e', '#ebf2df'], ['#4b4f57', '#eceef1']];
async function viewCalendar(ym, evId) {
  const evSel = evId && S.ov.events.find(e => e.id === evId) ? evId : '';
  const base = '#/calendar/', suffix = evSel ? '/' + evSel : '';
  const t = today();
  if (!/^\d{4}-\d{2}$/.test(ym || '') || Number(ym.slice(5)) < 1 || Number(ym.slice(5)) > 12) ym = (S.calYm || t.slice(0, 7));
  const evRow = evSel ? S.ov.events.find(e => e.id === evSel) : null;
  S.calYm = ym;
  const y = Number(ym.slice(0, 4)), m = Number(ym.slice(5));
  const first = ym + '-01', last = addDays(new Date(Date.UTC(y, m, 1)).toISOString().slice(0, 10), -1);
  const gridStart = addDays(first, -new Date(first + 'T00:00:00Z').getUTCDay());
  const gridEnd = addDays(last, 6 - new Date(last + 'T00:00:00Z').getUTCDay());
  const r = await rpc('admin_calendar', { p_from: gridStart, p_to: gridEnd });
  const arch = new Set(S.ov.archived.map(e => e.id));
  r.events = r.events.filter(e => !arch.has(e.id)); r.shifts = r.shifts.filter(s => !arch.has(s.event_id));
  if (evSel) { r.events = r.events.filter(e => e.id === evSel); r.shifts = r.shifts.filter(s => s.event_id === evSel); }
  const color = {}; r.events.forEach((e, i) => { color[e.id] = CAL_COLORS[i % CAL_COLORS.length]; });
  const evName = {}; r.events.forEach(e => { evName[e.id] = e.name; });
  const byDay = {};
  r.shifts.forEach(s => { (byDay[s.work_date] = byDay[s.work_date] || []).push({ type: 'shift', s }); });
  // 沒開班次的活動：活動期間每天顯示一筆
  r.events.filter(e => !e.has_shifts).forEach(e => { for (let x = e.start_date; x <= e.end_date && x <= gridEnd; x = addDays(x, 1)) if (x >= gridStart) (byDay[x] = byDay[x] || []).push({ type: 'event', e }); });
  if (!S.calDay || S.calDay.slice(0, 7) !== ym) S.calDay = t.slice(0, 7) === ym ? t : first;
  const shiftMonth = n => { const x = new Date(Date.UTC(y, m - 1 + n, 1)); return x.toISOString().slice(0, 7); };
  const years = []; for (let i = Math.min(y, Number(t.slice(0, 4))) - 3; i <= Math.max(y, Number(t.slice(0, 4))) + 3; i++) years.push(i);
  const chip = it => {
    const id = it.type === 'shift' ? it.s.event_id : it.e.id, [fg, bg] = color[id] || CAL_COLORS[6];
    const txt = it.type === 'shift' ? `${it.s.start} ${it.s.accepted}/${it.s.headcount} ${evName[id] || ''}` : `${it.e.name}（未排班次）`;
    return `<div class="chip" style="color:${fg};background:${bg}" title="${esc(txt)}">${esc(txt)}</div>`;
  };
  const cells = [];
  for (let x = gridStart; x <= gridEnd; x = addDays(x, 1)) {
    const items = byDay[x] || [];
    cells.push(`<button class="day${x.slice(0, 7) !== ym ? ' out' : ''}${x === t ? ' today' : ''}${x === S.calDay ? ' sel' : ''}" data-d="${x}" aria-pressed="${x === S.calDay}" aria-label="${esc(x)}，${items.length} 筆">

/* ---------- XLSX 產生器（不依賴外部套件；文字一律存成字串，身分證字號、民國生日不會被 Excel 轉格式） ---------- */

function buildXlsx(sheets) {

<cols>${sh.cols.map((c, i) => `<col min="${i + 1}" max="${i + 1}" width="${c.width || 12}" customWidth="1"/>`).join('')}</cols>

    ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((sh, i) => `<sheet name="${xesc(sh.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    // 樣式：0 文字、1 標題（粗體灰底）、2 有缺漏的列（淡黃底文字）、3 數字千分位、4 有缺漏的數字

/* ---------- 活動人員資料下載（五個階段共用一個按鈕）
   ZIP：人員資料.xlsx ＋ 每人一個資料夾（身分證正面、反面、存摺）。名單先留紀錄，每張證件照也各留調閱紀錄 ---------- */
const DOC_KINDS = [['id_front', '身分證正面'], ['id_back', '身分證反面'], ['bankbook', '存摺']];
async function exportEventPack(e, step) {
  const b = $('xpack'); if (b) { b.disabled = true; b.textContent = '準備中…'; }
  try {
    const r = await rpc('admin_event_people_export', { p_event: e.id });
    if (!r.ok) throw new Error('讀取人員資料失敗，請再試一次。');
    if (!r.rows.length) { flash('warn', '這場活動還沒有錄取、出勤或薪資單的人。'); return viewEvent(e.id, step); }
    const safe = t => String(t || '').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40);
    const files = [], rows = [], warn = new Set(); let got = 0, failed = 0;
    for (let i = 0; i < r.rows.length; i++) {
      const x = r.rows[i], dir = String(i + 1).padStart(3, '0') + '_' + safe(x.name) + '/', cells = [];
      for (const [kind, label] of DOC_KINDS) {
        const d = (x.docs || {})[kind]; let cell = '';
        if (d && d.file) {
          try {
            const res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify({ action: 'view_url', admin_token: S.token, person_id: x.person_id, kind }) });
            const v = await res.json();
            if (v.ok && !v.url && v.drive_url) cell = v.drive_url;
            else {
              if (!v.ok || !v.url) throw new Error('no_url');
              const ir = await fetch(v.url);
              if (!ir.ok) throw new Error('fetch');
              const fname = dir + label + '.' + (d.ext || 'jpg');
              files.push([fname, new Uint8Array(await ir.arrayBuffer())]); got++;
              cell = fname + (v.proof || v.legacy_thumb ? '（縮圖）' : '');
            }
          } catch (err) { failed++; cell = d.drive || '下載失敗'; }
        } else cell = d && d.drive ? d.drive : '未上傳';
        cells.push(cell);
      }
      if (!x.name || !x.national_id || !x.birth_date || !x.address || !x.bank_account || cells.some(c => /未上傳|失敗/.test(c))) warn.add(i);
      rows.push([i + 1, x.name || '', x.national_id || '', x.birth_date ? x.birth_date.replace(/-/g, '/') : '', x.address || '',
        x.bank_account_name || '', [x.bank_code, x.bank_branch].filter(Boolean).join(' '), x.bank_account || '', ...cells]);
      if (b) b.textContent = '準備中 ' + (i + 1) + '/' + r.rows.length;
    }
    const xlsx = buildXlsx([{ name: '人員資料', cols: [{ title: '序號', width: 6, num: true }, { title: '姓名', width: 12 }, { title: '身分證字號', width: 14 }, { title: '生日', width: 12 },
      { title: '地址', width: 44 }, { title: '戶名', width: 12 }, { title: '銀行代碼', width: 12 }, { title: '銀行帳號', width: 18 },
      { title: '身分證正面', width: 34 }, { title: '身分證反面', width: 34 }, { title: '存摺', width: 34 }], rows, warnRows: warn }]);
    files.unshift(['人員資料.xlsx', new Uint8Array(await xlsx.arrayBuffer())]);
    downloadBlob(zipStore(files, 'application/zip'), `人員資料_${safe(e.name)}_${today()}.zip`);
    flash(warn.size || failed ? 'warn' : 'ok', `已下載 ${r.rows.length} 人，證件照 ${got} 張${failed ? '（' + failed + ' 張下載失敗）' : ''}${warn.size ? '；' + warn.size + ' 人資料不完整，已在名單中標黃' : ''}。`);
  } catch (err) { if (err.message === 'session') return; flash('err', err.message); }
  viewEvent(e.id, step);
}

/* ---------- 加保名冊 ---------- */
const R_STATUS = [['accepted', '已錄取'], ['attended', '出勤紀錄（舊活動）'], ['applied', '待審'], ['waitlist', '備取'], ['rejected', '未錄取']];
const rocDate = s => s ? String(Number(s.slice(0, 4)) - 1911).padStart(3, '0') + s.slice(5, 7) + s.slice(8, 10) : '';
// 同一人、同一場、同一狀態的工作日，連續的合併成一段加保期間；不連續就分開列
function rosterGroups(rows) {
  const by = new Map();
  rows.forEach(r => { const k = r.person_id + '|' + r.event_id + '|' + r.status; if (!by.has(k)) by.set(k, []); by.get(k).push(r); });
  const out = [];
  by.forEach(list => {
    const days = [...new Map(list.map(r => [r.work_date, r])).values()].sort((a, b) => a.work_date < b.work_date ? -1 : 1);
    let run = [];
    const flush = () => {
      if (!run.length) return;
      const f = run[0], problems = [];
      if (!String(f.name || '').trim()) problems.push('缺姓名');
      if (!String(f.national_id || '').trim()) problems.push('缺身分證字號'); else if (!f.id_valid) problems.push('身分證字號格式錯誤');
      if (!f.birth_date) problems.push('缺出生年月日');
      const times = [...new Set(list.filter(r => run.some(x => x.work_date === r.work_date) && r.t_start).map(r => r.t_start + '–' + r.t_end))];
      out.push({ key: f.person_id + '|' + f.event_id + '|' + f.status + '|' + f.work_date, person_id: f.person_id, name: f.name, national_id: f.national_id, birth_date: f.birth_date,
        event_id: f.event_id, event_name: f.event_name, status: f.status, role: [...new Set(run.map(r => r.role).filter(Boolean))].join('、'), times: times.join('、'),
        from: f.work_date, to: run[run.length - 1].work_date, days: run.length, dates: run.map(r => md(r.work_date)).join('、'),
        relation: f.relation, insured: f.relation === 'contract' ? null : f.insured_salary, needIns: f.relation !== 'contract', problems });
      run = [];
    };
    days.forEach(r => { if (run.length && addDays(run[run.length - 1].work_date, 1) !== r.work_date) flush(); run.push(r); });
    flush();
  });
  return out;
}

    </div>

    <div class="card tablebox">${list.length ? `<table><thead><tr><th><input type="checkbox" id="all" aria-label="全選" ${list.every(g => S.rsel.has(g.key)) ? 'checked' : ''}></th><th>姓名</th><th>身分證字號</th><th>出生日期</th><th>活動</th><th>加保期間</th><th class="r">天數</th><th>狀態</th><th>檢查</th></tr></thead><tbody>
      ${list.map(g => `<tr><td><input type="checkbox" class="ck" data-k="${esc(g.key)}" ${S.rsel.has(g.key) ? 'checked' : ''} aria-label="選取 ${esc(g.name)}"></td>
        <td>${esc(g.name || '—')}</td><td style="font-family:var(--num)">${esc(g.national_id || '—')}</td><td style="font-family:var(--num)">${g.birth_date ? esc(rocDate(g.birth_date)) : '—'}</td>
        <td>${esc(g.event_name)}${g.role ? '<div class="dim">' + esc(g.role) + '</div>' : ''}</td>
        <td style="font-family:var(--num)">${esc(d(g.from))}${g.to !== g.from ? '–' + esc(md(g.to)) : ''}</td><td class="r">${g.days}</td>
        <td>${esc(stLabel[g.status] || g.status)}${g.needIns ? '' : ' <span class="badge">承攬</span>'}</td>
        <td>${g.problems.length ? g.problems.map(p => `<span class="badge warn">${esc(p)}</span>`).join(' ') : '<span class="badge ok">完整</span>'}</td></tr>`).join('')}
      </tbody></table>` : '<p class="empty">沒有符合條件的資料。</p>'}</div>`);
  const reload = () => viewRoster();
  let tq;
  $('rq').oninput = () => { clearTimeout(tq); tq = setTimeout(() => { F.q = $('rq').value.trim(); reload().then(() => { const x = $('rq'); x.focus(); x.setSelectionRange(x.value.length, x.value.length); }); }, 400); };
  $('rev').onchange = () => { F.event_id = $('rev').value; reload(); };
  $('rfrom').onchange = () => { F.from = $('rfrom').value; reload(); };
  $('rto').onchange = () => { F.to = $('rto').value; reload(); };
  $('rclear').onclick = () => { S.filter.roster = null; S.rsel.clear(); reload(); };
  on('.rst', 'click', (ev, b) => { const k = b.dataset.s; F.statuses = F.statuses.includes(k) ? F.statuses.filter(x => x !== k) : F.statuses.concat(k); if (!F.statuses.length) F.statuses = ['accepted']; reload(); });
  on('button.stat', 'click', (ev, b) => { F.view = b.dataset.v; reload(); });
  on('.ck', 'change', (ev, c) => { c.checked ? S.rsel.add(c.dataset.k) : S.rsel.delete(c.dataset.k); $('xsel').textContent = '匯出勾選（' + S.rsel.size + '）'; $('xsel').disabled = !S.rsel.size; });
  if ($('all')) $('all').onchange = () => { list.forEach(g => $('all').checked ? S.rsel.add(g.key) : S.rsel.delete(g.key)); reload(); };
  const doExport = async picked => {
    if (!picked.length) return;
    const btns = [$('xsel'), $('xall')]; btns.forEach(b => { b.disabled = true; });
    try {
      const log = await rpc('admin_log_export', { p_kind: 'insurance_roster', p_rows: picked.length, p_detail: { q: F.q, event_id: F.event_id, from: F.from, to: F.to, statuses: F.statuses, view: F.view, selected: picked.length !== list.length } });
      if (!log.ok) throw new Error('無法寫入匯出紀錄，這次沒有產生檔案。');
      const cols = [{ title: '序號', width: 6, num: true }, { title: '姓名', width: 10 }, { title: '身分證字號', width: 13 }, { title: '出生日期（民國）', width: 15 }, { title: '出生日期（西元）', width: 15 },
        { title: '活動', width: 26 }, { title: '加保日期', width: 12 }, { title: '退保日期', width: 12 }, { title: '天數', width: 6, num: true }, { title: '工作日期', width: 22 }, { title: '時段', width: 14 },
        { title: '崗位', width: 12 }, { title: '投保薪資', width: 10, num: true }, { title: '需加保', width: 8 }, { title: '報名狀態', width: 12 }, { title: '檢查結果', width: 22 }];
      const warn = new Set();
      const rows = picked.map((g, i) => { if (g.problems.length) warn.add(i); return [i + 1, g.name || '', g.national_id || '', rocDate(g.birth_date), g.birth_date ? g.birth_date.replace(/-/g, '/') : '', g.event_name,
        g.from.replace(/-/g, '/'), g.to.replace(/-/g, '/'), g.days, g.dates, g.times, g.role, g.insured == null ? '' : g.insured, g.needIns ? '是' : '否（承攬）', stLabel[g.status] || g.status, g.problems.join('、') || '完整']; });
      const probs = picked.map((g, i) => [i + 1, g]).filter(([, g]) => g.problems.length).map(([n, g]) => [n, g.name || '', g.national_id || '', g.event_name, g.problems.join('、')]);
      const blob = buildXlsx([
        { name: '加保名冊', cols, rows, warnRows: warn },
        { name: '資料檢查', cols: [{ title: '名冊序號', width: 9, num: true }, { title: '姓名', width: 10 }, { title: '身分證字號', width: 13 }, { title: '活動', width: 26 }, { title: '缺漏項目', width: 30 }], rows: probs.length ? probs : [['', '', '', '', '全部資料完整']] },
      ]);
      const ev = F.event_id && S.ov.events.find(e => e.id === F.event_id);
      const label = (ev ? ev.name : F.q || (F.from || F.to ? (F.from || '') + '至' + (F.to || '') : '全部活動')).replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40);
      downloadBlob(blob, `加保名冊_${label}_${today()}.xlsx`);
      flash('ok', `已匯出 ${picked.length} 筆${probs.length ? '，其中 ' + probs.length + ' 筆資料有缺漏，已在檔案中標黃並列在「資料檢查」分頁' : ''}。`);
      reload();
    } catch (err) { if (err.message !== 'session') { flash('err', err.message); reload(); } }
  };
  $('xsel').onclick = () => doExport(groups.filter(g => S.rsel.has(g.key)));
  $('xall').onclick = () => doExport(list);
}

}

async function viewDoc(personId, kind) {
  const win = window.open('', '_blank');
  try {
    const res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY }, body: JSON.stringify({ action: 'view_url', admin_token: S.token, person_id: personId, kind }) });

/* ---------- 薪資發放 ---------- */
function viewPayouts() {
  const t = today();

  const todo = evs.filter(e => !payDateOf(e) || e.published < e.total - e.void);
  shell('payouts', `<div class="head"><div><h1>薪資發放</h1><p class="sub">依發薪日排序。未設發薪日或尚未全部發布的活動排在待辦。</p></div></div>
    <div class="stats"><div class="card stat"><div class="k">待辦活動</div><div class="v" style="${todo.length ? 'color:var(--warn)' : ''}">${todo.length}</div></div>
      <div class="card stat"><div class="k">未發布薪資單</div><div class="v">${evs.reduce((a, e) => a + (e.total - e.void - e.published), 0)}</div></div>
      <div class="card stat"><div class="k">30 天內應發總額</div><div class="v">${money(evs.filter(e => payDateOf(e) && payDateOf(e) >= t && payDateOf(e) <= addDays(t, 30)).reduce((a, e) => a + Number(e.net_sum || 0), 0))}</div></div></div>
    <div class="card tablebox"><table><thead><tr><th>發薪日</th><th>活動</th><th class="r">已發布</th><th class="r">實發合計</th><th>狀態</th></tr></thead>
      <tbody>${evs.map(e => { const pending = e.total - e.void - e.published; const late = payDateOf(e) && payDateOf(e) < t && pending > 0;
        return `<tr data-k="${esc(e.id)}"><td>${payDateOf(e) ? esc(d(payDateOf(e))) : '<span class="badge warn">未設</span>'}</td><td><b>${esc(e.name)}</b></td><td class="r">${e.published} / ${e.total - e.void}</td><td class="r">${money(e.net_sum)}</td>
        <td>${late ? '<span class="badge error">已過發薪日仍有未發布</span>' : pending ? '<span class="badge warn">尚有 ' + pending + ' 張未發布</span>' : !payDateOf(e) ? '<span class="badge warn">待設發薪日</span>' : '<span class="badge ok">完成</span>'}</td></tr>`; }).join('') || '<tr><td colspan="5" class="empty">還沒有薪資單</td></tr>'}</tbody></table></div>`);
  on('tbody tr[data-k]', 'click', (ev, tr) => go('#/events/' + tr.dataset.k + '/payout'));
}

      <form id="wf" class="card pad"><b>新增或修改</b><p class="sub" style="margin:4px 0 0">依勞動部公告填寫。算薪時會用工作日當天適用的金額檢查時薪。</p>
      <label for="wd">生效日</label><input id="wd" type="date" required><label for="wh">每小時最低工資</label><input id="wh" type="text" inputmode="decimal" required>
      <label for="wm">每月最低工資</label><input id="wm" type="text" inputmode="numeric" required><div id="dm" style="margin-top:12px"></div><button class="btn block">儲存</button></form></div>`;
  } else if (tab === 'line') {
    const [ov, st] = await Promise.all([rpc('admin_line_overview'), lineCall('status').catch(() => ({ ok: false }))]);
    const KIND = { accepted: '錄取', reminder: '前一天提醒', checkout: '未簽退', payslip: '薪資單', test: '測試' };
    const NST = { sent: ['已送出', 'ok'], pending: ['等待中', ''], skipped: ['未送', 'warn'], failed: ['失敗', 'error'] };
    const WHY = { not_linked: '本人未綁定', disabled: '通知已關閉', no_longer_accepted: '已取消錄取', not_published: '已取消發布', already_out: '已簽退', expired: '過期未送' };
    const hook = LINE_FN;
    const conn = !st.ok ? '<div class="msg err">無法檢查連線狀態。</div>'
      : !st.configured ? `<div class="msg warn">還沒設定 LINE 金鑰（${st.has_secret ? '已有' : '缺少'} Channel secret、${st.has_token ? '已有' : '缺少'} Channel access token）。請照下方步驟設定。</div>`

      : `<div class="msg ok">已連線：${esc(st.name)}（${esc(st.basic_id)}）${st.quota != null ? '　本月已用 ' + st.used + ' / ' + st.quota + ' 則' : st.quota_type === 'none' ? '　本月已用 ' + st.used + ' 則（無上限）' : ''}</div>`;
    body = `${conn}
      <div class="stats"><div class="card stat"><div class="k">已綁定人數</div><div class="v">${ov.linked} / ${ov.people}</div></div>

        <div class="card stat"><div class="k">本月未送（未綁定等）</div><div class="v">${ov.month.skipped}</div></div>
        <div class="card stat"><div class="k">等待發送</div><div class="v">${ov.pending}</div></div></div>

        <div class="card tablebox"><table><thead><tr><th>時間</th><th>類型</th><th>對象</th><th>狀態</th></tr></thead>
        <tbody>${ov.recent.map(n => `<tr title="${esc(n.body || '')}"><td>${esc(d(n.at))} ${esc(new Intl.DateTimeFormat('zh-TW', { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(n.at)))}</td><td>${esc(KIND[n.kind] || n.kind)}</td>
          <td>${esc(n.name)}${n.event ? '<div class="dim">' + esc(n.event) + '</div>' : ''}</td><td><span class="badge ${NST[n.status][1]}">${NST[n.status][0]}</span>${n.error ? '<div class="dim">' + esc(WHY[n.error] || n.error) + '</div>' : ''}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">還沒有通知紀錄</td></tr>'}</tbody></table></div>

  } else {
    const r = await rpc('admin_list_admins');

    body = `<div class="split" style="grid-template-columns:minmax(0,1fr) minmax(300px,380px)"><div>

        <td class="r">${a.is_self ? '' : `<button class="link" data-reset="${esc(a.username)}">重設密碼</button>　<button class="link" style="color:var(--danger)" data-rm="${esc(a.username)}">移除</button>`}</td></tr>`).join('')}</tbody></table></div>
      <div id="am" style="margin-top:12px"></div>
      <form id="cpf" class="card pad" style="margin-top:16px;max-width:460px"><b>更改我的密碼</b>
        <label for="op">目前的密碼</label><input id="op" type="password" autocomplete="current-password" required>

        <div id="cm" style="margin-top:12px"></div><button class="btn block">更改密碼</button></form></div>
      <form id="af" class="card pad"><b>新增管理員</b><p class="sub" style="margin:4px 0 0">建立後把帳號和密碼私下交給對方，請對方登入後到這裡更改密碼。管理員可以看到所有人員的個資與證件。</p>
        <label for="nu">帳號</label><input id="nu" type="text" autocapitalize="none" autocomplete="off" placeholder="amy 或 amy@example.com" required>
        <label for="npw">初始密碼（至少 8 個字）</label><div class="row" style="align-items:center"><input id="npw" type="text" autocomplete="off" class="grow" style="width:auto;min-width:160px" required><button type="button" class="btn ghost sm" id="gen">產生</button></div>

  }
  shell('settings', `<div class="head"><div><h1>設定</h1></div></div>
    <div class="tabs" role="tablist">${TABS.map(([k, t]) => `<button class="tab" role="tab" aria-selected="${k === tab}" data-t="${k}">${t}</button>`).join('')}</div>${body}`);
  on('.tab', 'click', (ev, b) => viewSettings(b.dataset.t));
  const f = id => $(id);
  if (f('cf')) f('cf').onsubmit = async ev => { ev.preventDefault(); const r = await rpc('admin_update_employer', { p_patch: { legal_name: $('ln').value, tax_id: $('tx').value } }); if (!r.ok) { $('dm').innerHTML = '<div class="msg err">統一編號必須是 8 個數字。</div>'; return; } await loadOverview(); flash('ok', '公司資料已更新。'); viewSettings('company'); };
  if (f('hf')) {
    f('hf').onsubmit = async ev => { ev.preventDefault(); const r = await rpc('admin_holidays', { p_set: { day: $('hd').value, name: $('hn').value.trim() } }); if (r.ok === false) { $('dm').innerHTML = '<div class="msg err">日期或名稱有誤。</div>'; return; } flash('ok', '已新增。'); viewSettings('holidays'); };
    on('[data-del]', 'click', async (ev, b) => { await rpc('admin_holidays', { p_set: { day: b.dataset.del, name: '' } }); flash('ok', '已刪除 ' + d(b.dataset.del) + '。'); viewSettings('holidays'); });
  }
  if (f('lf')) {
    $('lf').onsubmit = async ev => { ev.preventDefault(); const r = await rpc('admin_line_settings', { p_patch: { basic_id: $('bid').value, enabled: $('len').checked } });
      if (!r.ok) { $('lm').innerHTML = '<div class="msg err">官方帳號 ID 格式不正確，應像 @123abcde。</div>'; return; } flash('ok', 'LINE 設定已儲存。'); viewSettings('line'); };
    $('tf').onsubmit = async ev => { ev.preventDefault(); const r = await rpc('admin_line_test', { p_national_id: $('tid').value });
      if (!r.ok) { $('tm').innerHTML = '<div class="msg err">' + ({ no_person: '找不到這個身分證字號。', not_linked: '這個人還沒有綁定 LINE。' }[r.error] || '傳送失敗。') + '</div>'; return; }
      const fr = await lineCall('flush'); $('tm').innerHTML = fr.ok && fr.sent ? '<div class="msg ok">已傳給 ' + esc(r.name) + '，請檢查 LINE。</div>' : '<div class="msg err">已排入佇列但尚未送出：' + esc(fr.error === 'not_configured' ? 'LINE 金鑰還沒設定' : '請看下方紀錄') + '。</div>'; };
    $('hkc').onclick = async () => { try { await navigator.clipboard.writeText($('hk').value); $('hkc').textContent = '已複製'; } catch (err) { $('hk').select(); } };
  }
  if (f('af')) {
    const rnd = () => { const c = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const a = new Uint32Array(14); crypto.getRandomValues(a); return [...a].map(x => c[x % c.length]).join(''); };
    $('gen').onclick = () => { $('npw').value = rnd(); };
    $('af').onsubmit = async ev => {
      ev.preventDefault();
      if (pwShort($('npw').value)) { $('nm').innerHTML = '<div class="msg err">密碼至少要 8 個字。</div>'; return; }
      const r = await rpc('admin_create_admin', { p_username: $('nu').value, p_password: $('npw').value });
      if (!r.ok) { $('nm').innerHTML = '<div class="msg err">' + ({ bad_username: '帳號請用 3 個字以上的英數字或 Email。', too_short: '密碼至少要 8 個字。', taken: '這個帳號已經存在。' }[r.error] || '新增失敗。') + '</div>'; return; }
      flash('ok', '已新增管理員 ' + $('nu').value.trim().toLowerCase() + '。請把帳號與初始密碼私下交給對方。'); viewSettings('admins');
    };
    $('cpf').onsubmit = async ev => {
      ev.preventDefault();
      if (pwShort($('np').value)) { $('cm').innerHTML = '<div class="msg err">新密碼至少要 8 個字。</div>'; return; }
      const r = await rpc('admin_change_password', { p_old: $('op').value, p_new: $('np').value });
      $('cm').innerHTML = r.ok ? '<div class="msg ok">密碼已更改，其他裝置上的登入已登出。</div>' : '<div class="msg err">' + (r.error === 'too_short' ? '新密碼至少要 8 個字。' : '目前的密碼不正確。') + '</div>';
      if (r.ok) { $('op').value = ''; $('np').value = ''; }

    on('[data-rm]', 'click', async (ev, b) => {
      if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = '確定移除？'; return; }
      const r = await rpc('admin_remove_admin', { p_username: b.dataset.rm });
      if (!r.ok) { $('am').innerHTML = '<div class="msg err">' + ({ self: '不能移除自己。', last: '至少要保留一位管理員。' }[r.error] || '移除失敗。') + '</div>'; return; }
      flash('ok', '已移除 ' + b.dataset.rm + '。'); viewSettings('admins');
    });
    on('[data-reset]', 'click', async (ev, b) => {
      const pw = rnd();
      const r = await rpc('admin_reset_admin', { p_username: b.dataset.reset, p_password: pw });
      $('am').innerHTML = r.ok ? '<div class="msg ok">' + esc(b.dataset.reset) + ' 的新密碼：<b style="font-family:var(--num)">' + esc(pw) + '</b>　請私下交給對方，這個密碼只會顯示這一次。</div>' : '<div class="msg err">' + (r.error === 'self' ? '自己的密碼請用下方「更改我的密碼」。' : '重設失敗。') + '</div>';
    });
  }
  if (f('wf')) f('wf').onsubmit = async ev => { ev.preventDefault(); const r = await rpc('admin_min_wages', { p_set: { effective_from: $('wd').value, hourly: $('wh').value, monthly: $('wm').value } }); if (!r.ok) { $('dm').innerHTML = '<div class="msg err">請確認日期與金額。</div>'; return; } flash('ok', '最低工資已儲存。'); viewSettings('wages'); };
}

/* ---------- 表格篩選排序（仿 Excel 自動篩選）：所有有表頭的資料表自動套用，重新繪製後保留條件 ---------- */
const XF = new Map(); // 以「表頭文字」辨識同一張表：{ col: { sort, vals:Set|null } }
const xText = td => (td ? td.innerText.split('\n')[0].trim() : '');
const xKey = t => [...t.tHead.rows[0].cells].map(c => c.dataset.xh || c.textContent.trim()).join('|');
function xVal(v) {
  const n = v.replace(/[,\s$NT元]/g, '');
  if (/^-?\d+(\.\d+)?$/.test(n)) return { t: 0, v: Number(n) };
  const d = v.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
  if (d) return { t: 1, v: Number(d[1]) * 1e4 + Number(d[2]) * 100 + Number(d[3]) };
  if (v === '' || v === '—' || v === '-') return { t: 3, v: '' };
  return { t: 2, v };
}
function xCmp(a, b) {
  const x = xVal(a), y = xVal(b);
  if (x.t !== y.t) return x.t - y.t;
  return x.t === 2 ? x.v.localeCompare(y.v, 'zh-Hant') : x.v - y.v;
}
function xApply(t) {
  const st = XF.get(xKey(t)) || {}, body = t.tBodies[0]; if (!body) return;
  const rows = [...body.rows];
  if (!t._xorder) t._xorder = rows.slice();
  let order = t._xorder.filter(r => r.parentNode === body);
  const sc = Object.keys(st).find(c => st[c].sort);
  if (sc) order = order.slice().sort((a, b) => (st[sc].sort === 'asc' ? 1 : -1) * xCmp(xText(a.cells[sc]), xText(b.cells[sc])));
  order.forEach(r => body.appendChild(r));
  let shown = 0;
  order.forEach(r => {
    const ok = Object.keys(st).every(c => !st[c].vals || st[c].vals.has(xText(r.cells[c])));
    r.style.display = ok ? '' : 'none'; if (ok) shown++;
  });
  [...t.tHead.rows[0].cells].forEach((th, i) => { const b = th.querySelector('.xf'); if (!b) return; const s = st[i] || {}; b.classList.toggle('on', !!(s.vals || s.sort)); b.textContent = s.sort === 'asc' ? '▲' : s.sort === 'desc' ? '▼' : s.vals ? '⧩' : '▾'; });
  let note = t.parentNode.querySelector(':scope > .xnote');
  const filtered = Object.values(st).some(s => s.vals);
  if (filtered) { if (!note) { note = document.createElement('div'); note.className = 'xnote'; t.after(note); } note.innerHTML = '篩選後顯示 ' + shown + '／' + order.length + ' 列　<button class="link" type="button">清除全部篩選</button>'; note.querySelector('button').onclick = () => { XF.delete(xKey(t)); xApply(t); }; }
  else if (note) note.remove();
}
function xClose() { const p = document.querySelector('.xpop'); if (p) p.remove(); document.removeEventListener('mousedown', xOutside, true); }
function xOutside(e) { if (!e.target.closest('.xpop') && !e.target.closest('.xf')) xClose(); }
function xOpen(t, col, btn) {
  xClose();
  const key = xKey(t), st = XF.get(key) || {}, cur = st[col] || {};
  const all = [...new Set(t._xorder.filter(r => r.parentNode === t.tBodies[0]).map(r => xText(r.cells[col])))].sort(xCmp);
  const pop = document.createElement('div'); pop.className = 'xpop';
  pop.innerHTML = `<button class="it" data-s="asc" type="button">↑ 由小到大排序</button><button class="it" data-s="desc" type="button">↓ 由大到小排序</button><hr>
    <input type="search" placeholder="搜尋"><div class="vals"><label><input type="checkbox" data-all checked> <b>（全選）</b></label>${all.map((v, i) => `<label><input type="checkbox" data-i="${i}" ${!cur.vals || cur.vals.has(v) ? 'checked' : ''}> ${esc(v || '（空白）')}</label>`).join('')}</div>
    <div class="acts"><button type="button" data-clear>清除</button><button type="button" data-cancel>取消</button><button type="button" class="ok" data-ok>確定</button></div>`;
  document.body.appendChild(pop);
  const r = btn.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - 260)) + 'px';
  pop.style.top = Math.min(r.bottom + 4, innerHeight - pop.offsetHeight - 8) + 'px';
  const boxes = [...pop.querySelectorAll('input[data-i]')], allBox = pop.querySelector('[data-all]');
  const syncAll = () => { const vis = boxes.filter(b => b.parentNode.style.display !== 'none'); allBox.checked = vis.every(b => b.checked); };
  syncAll();
  allBox.onchange = () => boxes.forEach(b => { if (b.parentNode.style.display !== 'none') b.checked = allBox.checked; });
  boxes.forEach(b => b.onchange = syncAll);
  pop.querySelector('input[type=search]').oninput = e => { const q = e.target.value.trim().toLowerCase(); boxes.forEach((b, i) => { const hit = !q || all[i].toLowerCase().includes(q); b.parentNode.style.display = hit ? '' : 'none'; if (q) b.checked = hit; }); syncAll(); };
  const save = fn => { const s = XF.get(key) || {}; fn(s); Object.keys(s).forEach(c => { if (!s[c].sort && !s[c].vals) delete s[c]; }); Object.keys(s).length ? XF.set(key, s) : XF.delete(key); xApply(t); xClose(); };
  pop.querySelectorAll('[data-s]').forEach(b => b.onclick = () => save(s => { Object.keys(s).forEach(c => { s[c].sort = null; }); s[col] = Object.assign(s[col] || {}, { sort: b.dataset.s }); }));
  pop.querySelector('[data-ok]').onclick = () => save(s => { const sel = new Set(boxes.filter(b => b.checked).map(b => all[Number(b.dataset.i)])); s[col] = Object.assign(s[col] || {}, { vals: sel.size === all.length ? null : sel }); });
  pop.querySelector('[data-clear]').onclick = () => save(s => { if (s[col]) { s[col].vals = null; s[col].sort = null; } });
  pop.querySelector('[data-cancel]').onclick = xClose;
  setTimeout(() => document.addEventListener('mousedown', xOutside, true));
}
function xEnhance(t) {
  if (t._xdone || !t.tHead || !t.tBodies[0] || t.tBodies[0].rows.length < 2) return;
  t._xdone = true; t._xorder = [...t.tBodies[0].rows];
  [...t.tHead.rows[0].cells].forEach((th, i) => {
    if (!th.textContent.trim() || th.querySelector('input,button')) return;
    th.dataset.xh = th.textContent.trim();
    const b = document.createElement('button'); b.type = 'button'; b.className = 'xf'; b.textContent = '▾'; b.setAttribute('aria-label', th.dataset.xh + '：篩選與排序');
    b.onclick = e => { e.stopPropagation(); xOpen(t, i, b); };
    th.appendChild(b);
  });
  xApply(t);
}
new MutationObserver(() => document.querySelectorAll('table').forEach(xEnhance)).observe(document.body, { childList: true, subtree: true });

route();
</script>
